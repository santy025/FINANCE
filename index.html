/* ---- PLAN DE SALIDA DE DEUDAS ---- */
function sheetDebtPlan(){
  if(!S.debts.length){openSheet(`<h2>Plan de salida de deudas</h2><div class="hd-sub">No tienes deudas registradas 🎉</div><button class="btn ghost" data-act="closesheet">Cerrar</button>`);return;}
  const totalMin=sum(S.debts.map(d=>d.minPayment||0)),totalBal=sum(S.debts.map(d=>d.balance));
  openSheet(`<h2>Plan de salida de deudas</h2><div class="hd-sub">Debes ${fmt(totalBal)} en ${S.debts.length} deuda${S.debts.length>1?'s':''}</div>
  <div class="field"><label>¿Cuánto EXTRA puedes abonar al mes?</label><input id="dpExtra" inputmode="numeric" placeholder="0" oninput="moneyInput(this);updateDebtPlan()"><span class="hint">Además de tus mínimos (${fmtShort(totalMin)}/mes).</span></div>
  <div id="dpRes"></div>`);
  updateDebtPlan();
}
function updateDebtPlan(){
  const r=$('#dpRes');if(!r)return;
  const extra=parseNum(val('dpExtra'));
  const av=simulateDebts(S.debts,extra,'avalanche'),sn=simulateDebts(S.debts,extra,'snowball');
  const tAv=debtFirstTarget(S.debts,'avalanche'),tSn=debtFirstTarget(S.debts,'snowball');
  const fmtMo=m=>!isFinite(m)?'∞':(m>=12?`${Math.floor(m/12)}a ${m%12}m`:`${m} mes${m===1?'':'es'}`);
  const box=(title,sim,tgt,rec)=>`<div class="card" style="${rec?'border:1.5px solid var(--emerald);':''}padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">${title}</b>${rec?'<span class="pill" style="background:var(--aurora-soft);color:var(--emerald)">Recomendado</span>':''}</div><div class="vstats" style="margin-top:10px"><div><div class="n num">${fmtMo(sim.months)}</div><div class="l">libre de deudas</div></div><div><div class="n num">${fmtShort(sim.interest)}</div><div class="l">intereses totales</div></div><div><div class="n num" style="font-size:12.5px;line-height:1.2">${tgt?esc(tgt.name):'—'}</div><div class="l">ataca primero</div></div></div></div>`;
  const recAv=av.interest<=sn.interest;
  const alcanza=isFinite(av.months)||isFinite(sn.months);
  r.innerHTML=(alcanza?'':`<div class="verdict bad" style="margin-bottom:12px">🔴<div><b style="display:block">No alcanza con este abono</b>Los intereses crecen más rápido que tus pagos. Sube el abono extra.</div></div>`)+
    box('🏔️ Avalancha',av,tAv,recAv)+box('❄️ Bola de nieve',sn,tSn,!recAv)+
    `<p class="mono-small" style="margin:4px 2px 0">Avalancha ataca la deuda de <b>mayor tasa</b> → pagas menos intereses. Bola de nieve ataca el <b>saldo más pequeño</b> → ganas impulso rápido. En ambas pagas los mínimos y el extra va a la deuda objetivo.</p>`;
}

  ${m.top.length?`<div class="divlab">En qué se fue</div><div class="card flat" style="padding:6px 14px">${m.top.map(t=>{const pct=m.exp>0?Math.round(t.v/m.exp*100):0;return `<div class="catrow" style="padding:9px 0"><div class="em">${t.cat.e}</div><div class="body"><div class="top"><span>${t.cat.n}</span><span class="num">${fmt(t.v)} <span class="pct">${pct}%</span></span></div><div class="track"><i style="width:${pct}%;background:var(--neg)"></i></div></div></div>`;}).join('')}</div>`:''}
  ${(()=>{const rs=(S.receivables||[]).filter(r=>((r.amount||0)-(r.collected||0))>0);if(!rs.length)return '';const tot=receivablesTotal(S);return `<div class="divlab">Te deben (${fmt(tot)})</div><div class="card flat" style="padding:2px 14px">${rs.map((r,i)=>{const rem=(r.amount||0)-(r.collected||0);const due=r.dueDate?new Date(r.dueDate+'T00:00'):null;const dn=due?relDaysNum(due):null;const late=dn!==null&&dn<0;return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0${i<rs.length-1?';border-bottom:1px solid var(--line)':''}"><div><b style="font-size:13.5px;font-weight:700">${esc(r.name)}</b><div style="font-size:11.5px;color:${late?'var(--neg)':'var(--faint)'};font-weight:600">${due?(late?'venció '+fmtDayShort(due):'cobrar '+fmtDayShort(due)):'sin fecha'}</div></div><b class="num" style="color:var(--blue);font-size:14px">${fmt(rem)}</b></div>`;}).join('')}</div>`;})()}
  <div class="verdict ${verdict[3]==='g'?'ok':verdict[3]==='r'?'bad':'warn'}" style="margin-top:14px">${verdict[0]}<div><b style="display:block">${verdict[1]}</b>${verdict[2]}</div></div>

function daySelect(id,val){let o='';for(let d=1;d<=31;d++)o+=`<option value="${d}" ${d===+val?'selected':''}>${d}</option>`;return `<div class="payDay">Día <select id="${id}">${o}</select></div>`;}
function payEditorInner(freq,paydays,act){

  const grid=`<div class="freqgrid">${F.map(([k,n,d])=>`<button class="freqbtn ${k===freq?'on':''}" data-act="${act}" data-f="${k}">${n}<small>${d}</small></button>`).join('')}</div>`;
  const pd=paydays&&paydays.length?paydays:defaultPaydays(freq);

  if(freq==='monthly')days=`<div class="field"><label>¿Qué día te pagan?</label><div class="paychips">${daySelect('pd0',pd[0]||30)}</div></div>`;
  else if(freq==='biweekly')days=`<div class="field"><label>Días de pago (2)</label><div class="paychips">${daySelect('pd0',pd[0]||15)}${daySelect('pd1',pd[1]||30)}</div></div>`;

}
function payEditor(freq,paydays,act){return `<div id="payWrap">${payEditorInner(freq,paydays,act)}</div>`;}
function readPaydays(freq){
  if(freq==='weekly')return [7,14,21,28];
  if(freq==='custom'){const e=document.getElementById('pdCustom');const arr=((e&&e.value)||'').split(',').map(x=>parseInt(x.trim())).filter(n=>n>=1&&n<=31);return arr.length?[...new Set(arr)].sort((a,b)=>a-b):[15,30];}
  const n=freq==='monthly'?1:freq==='biweekly'?2:3,arr=[];for(let i=0;i<n;i++){const e=document.getElementById('pd'+i);if(e)arr.push(parseInt(e.value));}return arr.length?arr:defaultPaydays(freq);
}

    <div style="text-align:center;margin:26px 0 18px"><div class="num" style="font-size:56px;font-weight:900;line-height:1"><span id="obRateVal">${OB.rate}%</span></div><div id="obRateMonthly" class="num" style="font-size:14px;color:var(--emerald);font-weight:800;margin-top:6px">${inc?'≈ '+fmt(inc*OB.rate/100)+'/mes':''}</div></div>
    <input class="slider" id="obRate" type="range" min="5" max="60" step="5" value="${OB.rate}" oninput="obRateSlide(this.value)"><div style="display:flex;justify-content:space-between;margin-top:8px"><span class="mono-small">5%</span><span class="mono-small">60%</span></div></div>`;
    foot=`<button class="btn primary" data-act="obnext">Continuar</button>`;
  } else if(st===6){
    body=`<div class="ostep fade"><div class="obig">Tu primera meta</div><div class="odesc">¿Para qué te gustaría ahorrar? Es opcional, pero ayuda a mantener el rumbo.</div><div class="field"><label>Nombre de la meta</label><input id="obGName" placeholder="Ej: Fondo de emergencia" value="${esc(OB.gName)}"></div><div class="frow"><div class="field"><label>Monto objetivo</label><input id="obGTarget" inputmode="numeric" placeholder="0" value="${OB.gTarget?parseNum(OB.gTarget).toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div><div class="field"><label>Fecha (opcional)</label><input id="obGDate" type="date" value="${OB.gDate}"></div></div></div>`;
    foot=`<div class="btn-row"><button class="btn ghost" data-act="obskip">Omitir</button><button class="btn primary" data-act="obnext">Continuar</button></div>`;
  } else if(st===7){
    body=`<div class="ostep fade"><div class="obig">¿Tienes alguna deuda?</div><div class="odesc">Te ayudamos a darle salida y calcular tu fecha de libertad. Opcional.</div><div class="field"><label>Nombre</label><input id="obDName" placeholder="Ej: Tarjeta de crédito" value="${esc(OB.dName)}"></div><div class="field"><label>Saldo que debes</label><input id="obDBal" inputmode="numeric" placeholder="0" value="${OB.dBal?parseNum(OB.dBal).toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div><div class="frow"><div class="field"><label>Tasa % E.A.</label><input id="obDRate" inputmode="decimal" placeholder="0" value="${OB.dRate}"></div><div class="field"><label>Cuota mensual</label><input id="obDMin" inputmode="numeric" placeholder="0" value="${OB.dMin?parseNum(OB.dMin).toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div></div></div>`;

<script>
/* =================== ACCIONES / MUTACIONES =================== */
function ensureAccount(type){let a=S.accounts.find(x=>x.type===type);if(!a){a={id:uid(),name:ACC_TYPES[type].n,type,balance:0};S.accounts.push(a);}return a;}
function accOr(id,type){if(id&&id!=='__auto'&&id!=='__new'){const a=acc(id);if(a)return a;}return ensureAccount(type);}
function syncNW(){const k=mkey(new Date()),nw=netWorth(S),h=S.nwHist;const i=h.findIndex(x=>x.k===k);if(i>=0)h[i].v=nw;else h.push({k,v:nw});h.sort((a,b)=>a.k<b.k?-1:1);if(h.length>18)S.nwHist=h.slice(-18);}
function commit(){syncNW();save();render();toast('Guardado ✓');}
const val=id=>{const e=$('#'+id);return e?e.value:'';};

function saveTransaction(){
  const amt=parseNum(val('qaAmt')); if(amt<=0)return;
  const type=QA_TYPE, note=val('qaNote').trim(), date=val('qaDate')||todayISO();
  const tx={id:uid(),type,amount:amt,date,note};
  if(type==='expense'){const a=accOr(val('qaSrc'),'bank');a.balance-=amt;tx.category=QA_CAT||'other';tx.accountId=a.id;}
  else if(type==='income'){const a=accOr(val('qaSrc'),'bank');a.balance+=amt;tx.category=QA_CAT||'salary';tx.accountId=a.id;}
  else if(type==='saving'){const s2=accOr(val('qaSrc'),'bank'),d=accOr(val('qaDest'),'savings');s2.balance-=amt;d.balance+=amt;tx.category='other';tx.accountId=d.id;tx.fromId=s2.id;}
  else if(type==='investment'){const s2=accOr(val('qaSrc'),'bank'),d=accOr(val('qaDest'),'investment');s2.balance-=amt;d.balance+=amt;tx.category='interest';tx.accountId=d.id;tx.fromId=s2.id;}
  S.tx.push(tx); closeSheet(); commit();
}
function saveGoal(id){
  const name=val('gName').trim(), target=parseNum(val('gTarget')); if(!name||target<=0)return;
  const data={name,icon:val('gIcon')||'🎯',target,saved:parseNum(val('gSaved')),monthly:parseNum(val('gMonthly')),targetDate:val('gDate')||''};
  if(id){const g=S.goals.find(x=>x.id===id);if(g)Object.assign(g,data);}
  else S.goals.push(Object.assign({id:uid()},data));
  closeSheet(); commit();
}
function saveContrib(id){
  const g=S.goals.find(x=>x.id===id);if(!g)return;const amt=parseNum(val('cAmt'));if(amt<=0)return;
  const src=accOr(val('cSrc'),'bank'),d=ensureAccount('savings');src.balance-=amt;d.balance+=amt;g.saved+=amt;
  S.tx.push({id:uid(),type:'saving',amount:amt,date:todayISO(),note:'Abono a '+g.name,category:'other',accountId:d.id,fromId:src.id,goalId:g.id});
  closeSheet(); commit();
}
function saveAcc(id){
  const name=val('aName').trim(), type=val('aType')||'bank', raw=parseNum(val('aBal')); if(!name)return;
  const balance=type==='credit'?-raw:raw;
  if(id){const a=acc(id);if(a){a.name=name;a.type=type;a.balance=balance;}}
  else S.accounts.push({id:uid(),name,type,balance});
  closeSheet(); commit();
}
function saveDebt(id){
  const name=val('dName').trim(), balance=parseNum(val('dBal')); if(!name||balance<=0)return;
  const data={name,balance,rate:parseFloat(val('dRate'))||0,minPayment:parseNum(val('dMin'))};
  if(id){const d=S.debts.find(x=>x.id===id);if(d)Object.assign(d,data);}
  else S.debts.push(Object.assign({id:uid()},data));
  closeSheet(); commit();
}
function savePay(){
  const d=S.debts.find(x=>x.id===val('pDebt'));if(!d)return;const amt=parseNum(val('pAmt'));if(amt<=0)return;
  const src=accOr(val('pSrc'),'bank');src.balance-=amt;d.balance=Math.max(0,d.balance-amt);
  S.tx.push({id:uid(),type:'debt',amount:amt,date:todayISO(),note:'Pago '+d.name,category:'other',accountId:src.id,debtId:d.id});
  closeSheet(); commit();
}
function saveTransfer(){
  const from=acc(val('trFrom')),to=acc(val('trTo')),amt=parseNum(val('trAmt'));
  if(!from||!to){toast('Elige las cuentas');return;} if(from.id===to.id){toast('Elige cuentas distintas');return;} if(amt<=0)return;
  from.balance-=amt; to.balance+=amt;
  S.tx.push({id:uid(),type:'transfer',amount:amt,date:todayISO(),note:(val('trNote').trim()||('De '+from.name+' a '+to.name)),category:'other',accountId:to.id,fromId:from.id});
  closeSheet(); commit();
}
function saveReceivable(id){
  const name=val('rvName').trim(),amount=parseNum(val('rvAmount'));if(!name||amount<=0)return;
  const data={name,amount,dueDate:val('rvDate')||'',note:val('rvNote').trim()};
  if(id){const r=S.receivables.find(x=>x.id===id);if(r){const kc=r.collected;Object.assign(r,data);r.collected=kc||0;}}
  else S.receivables.push(Object.assign({id:uid(),collected:0},data));
  closeSheet(); commit();
}
function delReceivable(id){S.receivables=S.receivables.filter(x=>x.id!==id);closeSheet();commit();}
function saveCollect(id){
  const rc=S.receivables.find(x=>x.id===id);if(!rc)return;const rem=Math.max(0,(rc.amount||0)-(rc.collected||0));
  const amt=Math.min(rem,parseNum(val('rcAmt'))||rem);if(amt<=0)return;
  const to=accOr(val('rcTo'),'bank');to.balance+=amt;rc.collected=(rc.collected||0)+amt;
  S.tx.push({id:uid(),type:'collect',amount:amt,date:todayISO(),note:'Cobro a '+rc.name,category:'other',accountId:to.id,receivableId:rc.id});
  closeSheet(); commit();
}
function deleteTx(id){
  const i=S.tx.findIndex(x=>x.id===id);if(i<0)return;const t=S.tx[i];
  applyTxEffect(t,-1);
  S.tx.splice(i,1); closeSheet(); commit();
}
function delGoal(id){S.goals=S.goals.filter(x=>x.id!==id);closeSheet();commit();}
function delAcc(id){S.accounts=S.accounts.filter(x=>x.id!==id);closeSheet();commit();}
function delDebt(id){S.debts=S.debts.filter(x=>x.id!==id);closeSheet();commit();}
function toggleTheme(){S.profile.theme=S.profile.theme==='dark'?'light':'dark';document.querySelector('meta[name=theme-color]').setAttribute('content',S.profile.theme==='dark'?'#0B0C11':'#EEF1F7');save();render();}
function resetAll(){if(!confirm('¿Seguro que quieres borrar todo y empezar de cero? Esta acción no se puede deshacer.'))return;S=DEFAULT();save();closeSheet();showOnboarding();}

/* ===== NOTIFICACIONES (permiso, disparo, PWA) ===== */
const APP_ICON="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#17E6A1'/><stop offset='0.5' stop-color='#35D6E8'/><stop offset='1' stop-color='#7C6CFF'/></linearGradient></defs><rect width='512' height='512' rx='115' fill='url(#g)'/><path d='M120 120v272h272' fill='none' stroke='#04130D' stroke-width='34' stroke-linecap='round' stroke-linejoin='round'/><path d='M170 300l70-70 55 55 95-110' fill='none' stroke='#04130D' stroke-width='34' stroke-linecap='round' stroke-linejoin='round'/></svg>");
function notifySupported(){return typeof window!=='undefined'&&'Notification'in window;}
function osNotify(title,body){try{if(!notifySupported()||Notification.permission!=='granted')return;new Notification(title,{body:body,icon:APP_ICON,badge:APP_ICON,tag:title});}catch(e){}}
async function enableNotifs(){
  if(!notifySupported()){toast('Este navegador no soporta notificaciones');return;}
  try{const p=await Notification.requestPermission();
    if(p==='granted'){S.profile.notif=S.profile.notif||{};S.profile.notif.on=true;save();render();toast('Notificaciones activadas ✓');osNotify('My Wealth OS','¡Listo! Te avisaré de pagos, topes y deudas.');setTimeout(fireDueNotifications,600);}
    else if(p==='denied'){toast('Están bloqueadas en el navegador');render();}
  }catch(e){toast('No se pudo activar');}
}
function fireDueNotifications(){
  if(!S||!S.profile.notif||!S.profile.notif.on)return;
  if(!notifySupported()||Notification.permission!=='granted')return;
  const today=todayISO();S.notifFired=S.notifFired||{};let fired=false;

  if(fired)save();
}

/* ===== RECURRENTES AUTOMÁTICOS ===== */
function nextOccurrenceAfter(day,from){let d=new Date(from);d.setDate(d.getDate()+1);for(let i=0;i<400;i++){const dim=daysInMonth(d);if(d.getDate()===Math.min(day,dim))return new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()+1);}return new Date(from);}
function postRecurringTx(r,date){
  const iso=date.toISOString().slice(0,10);
  const a=accOr(r.accountId,'bank');
  const tx={id:uid(),type:r.type,amount:r.amount,date:iso,note:r.name,category:r.category||(r.type==='income'?'salary':'services'),accountId:a.id,recur:r.id};
  if(r.type==='income')a.balance+=r.amount; else a.balance-=r.amount;
  S.tx.push(tx);
}
function runRecurring(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let posted=0;
  (S.recurring||[]).forEach(r=>{
    if(!r.auto||!r.amount)return;
    const day=r.day||1;
    let cursor=r.lastPostedISO?new Date(r.lastPostedISO+'T00:00'):today;
    let next=nextOccurrenceAfter(day,cursor),guard=0;
    while(next<=today&&guard<400){
      postRecurringTx(r,next);
      r.lastPostedISO=next.toISOString().slice(0,10);
      cursor=next; next=nextOccurrenceAfter(day,cursor); guard++; posted++;
    }
    if(!r.lastPostedISO)r.lastPostedISO=today.toISOString().slice(0,10); // ancla para no postear meses viejos
  });
  if(posted>0)save();
  return posted;
}
function saveRecurring(id){
  const name=val('rName').trim(),amount=parseNum(val('rAmount'));if(!name||amount<=0)return;
  const data={type:val('rType')||'expense',name,amount,category:val('rCat')||'services',day:clamp(parseInt(val('rDay'))||1,1,31),accountId:val('rAcc')||'',auto:true};
  if(id){const r=S.recurring.find(x=>x.id===id);if(r){const keep=r.lastPostedISO;Object.assign(r,data);r.lastPostedISO=keep;}}
  else S.recurring.push(Object.assign({id:uid(),lastPostedISO:todayISO()},data));
  closeSheet();commit();
}
function delRecurring(id){S.recurring=S.recurring.filter(x=>x.id!==id);closeSheet();commit();}

/* ===== CADENAS DE AHORRO (ahorro progresivo con acumulado) ===== */
function chainCalc(c){
  const target=c.months>0?c.monthly*c.months:0;
  const pct=target>0?clamp((c.saved||0)/target,0,1):0;
  const remMonths=c.months>0?Math.max(0,c.months-(c.count||0)):null;
  const remAmount=target>0?Math.max(0,target-(c.saved||0)):null;
  const done=c.months>0&&(c.count||0)>=c.months;
  const next=nextOccurrenceAfter(c.day||1,c.lastPostedISO?new Date(c.lastPostedISO+'T00:00'):new Date());
  return {target,pct,remMonths,remAmount,done,next};
}
function applyChainContribution(c,date,amount){
  const amt=amount||c.monthly; if(amt<=0)return;
  const src=accOr(c.accountId,'bank'),d=ensureAccount('savings');
  src.balance-=amt; d.balance+=amt; c.saved=(c.saved||0)+amt; c.count=(c.count||0)+1;
  S.tx.push({id:uid(),type:'saving',amount:amt,date:(date||new Date()).toISOString?date.toISOString().slice(0,10):todayISO(),note:'Cadena: '+c.name,category:'other',accountId:d.id,fromId:src.id,chainId:c.id});
}
function runChains(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());let posted=0;
  (S.chains||[]).forEach(c=>{
    if(!c.auto||!c.monthly)return;
    const day=c.day||1;
    let cursor=c.lastPostedISO?new Date(c.lastPostedISO+'T00:00'):today;
    let next=nextOccurrenceAfter(day,cursor),guard=0;
    while(next<=today&&guard<400&&(!(c.months>0)||(c.count||0)<c.months)){
      applyChainContribution(c,next); c.lastPostedISO=next.toISOString().slice(0,10);
      cursor=next; next=nextOccurrenceAfter(day,cursor); guard++; posted++;
    }
    if(!c.lastPostedISO)c.lastPostedISO=today.toISOString().slice(0,10);
  });
  if(posted>0)save();
  return posted;
}
function saveChain(id){
  const name=val('chName').trim(),monthly=parseNum(val('chMonthly'));if(!name||monthly<=0)return;
  const data={name,monthly,months:clamp(parseInt(val('chMonths'))||0,0,600),day:clamp(parseInt(val('chDay'))||1,1,31),accountId:val('chAcc')||'',auto:$('#chAuto')?$('#chAuto').getAttribute('data-on')==='1':true,color:CHAIN_TMP.color};
  if(id){const c=S.chains.find(x=>x.id===id);if(c){const kp=c.lastPostedISO,ks=c.saved,kc=c.count;Object.assign(c,data);c.lastPostedISO=kp;c.saved=ks;c.count=kc;}}
  else S.chains.push(Object.assign({id:uid(),saved:0,count:0,lastPostedISO:todayISO()},data));
  closeSheet();commit();
}
function delChain(id){S.chains=S.chains.filter(x=>x.id!==id);closeSheet();commit();}
function saveContribChain(id){
  const c=S.chains.find(x=>x.id===id);if(!c)return;const amt=parseNum(val('ccAmt'))||c.monthly;if(amt<=0)return;
  const src=accOr(val('ccSrc'),'bank'),d=ensureAccount('savings');
  src.balance-=amt;d.balance+=amt;c.saved=(c.saved||0)+amt;c.count=(c.count||0)+1;
  S.tx.push({id:uid(),type:'saving',amount:amt,date:todayISO(),note:'Cadena: '+c.name,category:'other',accountId:d.id,fromId:src.id,chainId:c.id});
  closeSheet();commit();
}

/* ===== PRESUPUESTOS POR CATEGORÍA ===== */
function saveBudgets(){
  const b={};EXP_CATS.forEach(c=>{const v=parseNum(val('bud_'+c.id));if(v>0)b[c.id]=v;});
  S.budgets=b; S.profile.monthlyBudget=parseNum(val('bud_total'));
  closeSheet();commit();
}
function budgetStatus(s){
  const cur=monthCats(s,0),out=[];
  Object.keys(s.budgets||{}).forEach(id=>{const lim=s.budgets[id];if(lim>0){const spent=cur[id]||0;out.push({id,cat:catOf('expense',id),spent,lim,pct:clamp(spent/lim,0,2)});}});
  return out.sort((a,b)=>b.pct-a.pct);
}

/* ===== PLAN DE SALIDA DE DEUDAS ===== */
function simulateDebts(debts,extra,method){
  let ds=debts.map(d=>({bal:d.balance,r:(d.rate||0)/100/12,min:d.minPayment||0}));
  const budget=sum(ds.map(d=>d.min))+extra;
  if(budget<=0)return {months:Infinity,interest:0};
  let months=0,interest=0;
  while(ds.some(d=>d.bal>0.5)&&months<1200){
    months++;
    ds.forEach(d=>{if(d.bal>0){const i=d.bal*d.r;d.bal+=i;interest+=i;}});
    let pool=budget;
    ds.forEach(d=>{if(d.bal>0){const pay=Math.min(d.bal,d.min);d.bal-=pay;pool-=pay;}});
    const active=ds.filter(d=>d.bal>0);
    active.sort((a,b)=>method==='avalanche'?b.r-a.r:a.bal-b.bal);
    for(const d of active){if(pool<=0)break;const pay=Math.min(d.bal,pool);d.bal-=pay;pool-=pay;}
    // si el presupuesto no cubre ni intereses, evita loop infinito
    if(months>1&&ds.every(d=>d.bal>0)&&pool>=budget-0.5)break;
  }
  return {months:months>=1200?Infinity:months,interest:Math.round(interest)};
}
function debtFirstTarget(debts,method){const a=debts.filter(d=>d.balance>0);if(!a.length)return null;a.sort((x,y)=>method==='avalanche'?((y.rate||0)-(x.rate||0)):(x.balance-y.balance));return a[0];}

/* ===== FOTO DE PERFIL ===== */
function pickPhoto(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{
      const sz=256,c=document.createElement('canvas');c.width=sz;c.height=sz;const ctx=c.getContext('2d');
      const scale=Math.max(sz/img.width,sz/img.height),w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(sz-w)/2,(sz-h)/2,w,h);
      try{S.profile.photo=c.toDataURL('image/jpeg',0.82);}catch(e){toast('No pude procesar la imagen');return;}
      save();render();
      const av=document.getElementById('pfAvatar');if(av){av.style.backgroundImage='url('+S.profile.photo+')';av.style.backgroundSize='cover';av.style.backgroundPosition='center';av.textContent='';}
      toast('Foto actualizada ✓');
    };img.onerror=()=>toast('Imagen no válida');img.src=rd.result;};
    rd.readAsDataURL(f);};
  inp.click();
}
function removePhoto(){S.profile.photo='';save();render();const av=document.getElementById('pfAvatar');if(av){av.style.backgroundImage='';av.textContent=(S.profile.name||'U')[0].toUpperCase();}toast('Foto eliminada');}
function avatarBtn(cls,style,act,dtab){

  <div class="divlab">¿Cada cuánto te pagan?</div>${payEditor(PF.freq,PF.paydays,'pfreq')}

function saveProfile(){

function finishOnboarding(){
  captureOB();
  S=DEFAULT();
  S.profile.name=(OB.name||'').trim();

  S.profile.savingsRate=OB.rate;

  S.profile.paydays=(OB.paydays&&OB.paydays.length?OB.paydays:defaultPaydays(S.profile.payFreq));
  S.profile.onboarded=true; S.profile.start=todayISO();
  const add=(name,type,v)=>{const n=parseNum(v);if(n>0)S.accounts.push({id:uid(),name,type,balance:type==='credit'?-n:n});};
  add('Banco','bank',OB.banco); add('Efectivo','cash',OB.efectivo);
  add('Ahorros','savings',OB.ahorros); add('Inversiones','investment',OB.inversiones);
  if(!S.accounts.some(a=>LIQUID.includes(a.type)))S.accounts.push({id:uid(),name:'Banco',type:'bank',balance:0});
  const fijos=parseNum(OB.fijos); if(fijos>0)S.recurring.push({id:uid(),type:'expense',name:'Gastos fijos',amount:fijos});
  const gt=parseNum(OB.gTarget); if((OB.gName||'').trim()&&gt>0)S.goals.push({id:uid(),name:OB.gName.trim(),icon:'🎯',target:gt,saved:0,monthly:Math.round(S.profile.income*S.profile.savingsRate/100),targetDate:OB.gDate||''});
  const db=parseNum(OB.dBal); if((OB.dName||'').trim()&&db>0)S.debts.push({id:uid(),name:OB.dName.trim(),balance:db,rate:parseFloat(OB.dRate)||0,minPayment:parseNum(OB.dMin)});
  const nw=netWorth(S),monthly=(S.profile.income*S.profile.savingsRate/100)||Math.max(50000,nw*0.03),now=new Date(),h=[];
  for(let i=5;i>=1;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);h.push({k:mkey(d),v:Math.max(0,Math.round(nw-monthly*i))});}
  h.push({k:mkey(now),v:nw}); S.nwHist=h;
  save();
  $('#onb').style.display='none';$('#app').style.display='flex';TAB='home';render();
}

/* =================== INIT =================== */
async function init(){
  try{ S=await loadState(); }catch(e){ S=null; }
  setupPWA();
  const sp=$('#splash');

  if(S&&S.profile.onboarded){

    setTimeout(fireDueNotifications,800);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)fireDueNotifications();});
    window.addEventListener('focus',fireDueNotifications);

  } else {
    S=DEFAULT(); showOnboarding();
  }
  setTimeout(()=>{sp.classList.add('hide');setTimeout(()=>{try{sp.remove();}catch(e){}},500);},380);
}
