<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C11">
<title>My Wealth OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root, [data-theme="dark"]{
  --bg:#0B0C11; --bg-soft:#0F1017; --surface:#15161F; --surface-2:#1C1E29; --surface-3:#23252F;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#F4F6FB; --dim:#9CA3B4; --faint:#616A7D;
  --emerald:#17E6A1; --cyan:#35D6E8; --violet:#7C6CFF; --gold:#FFC24B;
  --pos:#17E6A1; --neg:#FF6584; --orange:#FF9A52; --blue:#4DA6FF;
  --aurora:linear-gradient(135deg,#17E6A1 0%,#35D6E8 46%,#7C6CFF 100%);
  --aurora-soft:linear-gradient(135deg,rgba(23,230,161,.16),rgba(124,108,255,.16));
  --glass:rgba(255,255,255,.04); --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --shadow-lg:0 30px 70px -20px rgba(0,0,0,.8);
}
[data-theme="light"]{
  --bg:#EEF1F7; --bg-soft:#E6EAF2; --surface:#FFFFFF; --surface-2:#F4F6FB; --surface-3:#EAEEF6;
  --line:rgba(12,18,30,.09); --line-2:rgba(12,18,30,.16);
  --text:#0D1220; --dim:#5A6376; --faint:#8A93A6;
  --emerald:#06B77C; --cyan:#0F9FC4; --violet:#6A5AF0; --gold:#E0A020;
  --pos:#06B77C; --neg:#E5476B; --orange:#E5772A; --blue:#2E7DE0;
  --aurora:linear-gradient(135deg,#0FC98D 0%,#22B6D8 46%,#6A5AF0 100%);
  --aurora-soft:linear-gradient(135deg,rgba(6,183,124,.12),rgba(106,90,240,.12));
  --glass:rgba(255,255,255,.6); --shadow:0 18px 40px -22px rgba(30,40,70,.28);
  --shadow-lg:0 30px 70px -24px rgba(30,40,70,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:#05060A; color:var(--text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
[data-theme="light"] body{background:#DDE3EE}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:rgba(124,108,255,.35)}

/* ============ APP FRAME ============ */
#app{
  position:relative; max-width:460px; margin:0 auto; min-height:100dvh;
  background:radial-gradient(140% 60% at 50% -8%, rgba(124,108,255,.10), transparent 60%),
             radial-gradient(120% 50% at 50% 0%, rgba(23,230,161,.06), transparent 55%),
             var(--bg);
  display:flex; flex-direction:column; overflow:hidden;
}
.view{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 118px;
  scrollbar-width:none;}
.view::-webkit-scrollbar{display:none}

/* ============ HEADER ============ */
.hdr{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px}
.hdr .hi{font-size:14px; color:var(--dim); font-weight:500}
.hdr .hi b{color:var(--text); font-weight:700}
.hdr .date{font-size:12px; color:var(--faint); margin-top:1px}
.hdr .ttl{font-size:23px; font-weight:800; letter-spacing:-.03em}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:var(--surface); border:1px solid var(--line); color:var(--dim); transition:.18s;}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:19px;height:19px}
.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;
  font-size:15px;color:#04120C;background:var(--aurora)}

/* ============ HERO: PUEDES GASTAR ============ */
.hero{position:relative; border-radius:26px; padding:22px 22px 24px; overflow:hidden; margin-bottom:16px;
  background:var(--aurora); color:#04130D; box-shadow:0 24px 50px -20px rgba(23,150,120,.55); isolation:isolate}
[data-theme="light"] .hero{box-shadow:0 24px 50px -22px rgba(20,140,110,.5)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(120% 90% at 85% -10%, rgba(255,255,255,.4), transparent 45%),
            radial-gradient(90% 70% at 5% 110%, rgba(4,20,14,.28), transparent 50%);}
.hero .lab{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.hero .big{font-size:52px;font-weight:900;letter-spacing:-.045em;line-height:1;margin:8px 0 2px}
.hero .sub{font-size:13px;font-weight:600;opacity:.7;max-width:230px;line-height:1.35}
.hero .tag{position:absolute;top:20px;right:20px;background:rgba(4,19,13,.16);backdrop-filter:blur(4px);
  padding:6px 11px;border-radius:999px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px}
.hero .bar{height:7px;border-radius:99px;background:rgba(4,19,13,.18);margin-top:16px;overflow:hidden}
.hero .bar>i{display:block;height:100%;border-radius:99px;background:rgba(255,255,255,.85)}
.hero .foot{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;opacity:.72;margin-top:8px}

/* ============ CARDS ============ */
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px;}
.card.flat{background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat .k{font-size:12px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:7px}
.stat .d{font-size:12px;font-weight:700;margin-top:3px}
.up{color:var(--pos)} .down{color:var(--neg)}
.eyebrow{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.02em}
.sect-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.sect-h h3{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sect-h .lnk{font-size:12.5px;font-weight:700;color:var(--violet)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* networth card */
.nw{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);
  border-radius:22px;padding:18px 18px 6px;position:relative;overflow:hidden}
.nw .k{font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.nw .v{font-size:34px;font-weight:900;letter-spacing:-.04em;margin-top:4px}
.nw .chg{font-size:13px;font-weight:700;margin-top:2px;display:inline-flex;align-items:center;gap:5px}
.nw svg{display:block;width:100%;height:74px;margin-top:2px}

/* ============ QUICK ACTIONS ============ */
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:4px 0 2px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;border-radius:17px;
  background:var(--surface);border:1px solid var(--line);transition:.16s}
.qa button:active{transform:scale(.94);background:var(--surface-2)}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.qa .ic svg{width:19px;height:19px}
.qa span{font-size:10.5px;font-weight:700;color:var(--dim)}
.qa .expense .ic{background:rgba(255,101,132,.14);color:var(--neg)}
.qa .income .ic{background:rgba(23,230,161,.14);color:var(--pos)}
.qa .saving .ic{background:rgba(53,214,232,.14);color:var(--cyan)}
.qa .invest .ic{background:rgba(124,108,255,.16);color:var(--violet)}
.qa .debt .ic{background:rgba(255,154,82,.15);color:var(--orange)}

/* ============ PUEDO DARME GUSTO BTN ============ */
.treat{width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:18px;margin-top:14px;
  background:linear-gradient(120deg,var(--surface-2),var(--surface));border:1px solid var(--line-2);transition:.16s}
.treat:active{transform:scale(.98)}
.treat .em{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;
  background:var(--aurora-soft)}
.treat .tx{flex:1;text-align:left}
.treat .tx b{font-size:14.5px;font-weight:800;display:block}
.treat .tx small{font-size:12px;color:var(--dim);font-weight:500}
.treat .arw{color:var(--faint)}

/* ============ LISTS / ROWS ============ */
.row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .em{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:var(--surface-2);flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b{font-size:14px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{font-size:12px;color:var(--faint);font-weight:500}
.row .amt{font-size:14.5px;font-weight:800;letter-spacing:-.02em;text-align:right;white-space:nowrap}

/* ============ CATEGORY BARS ============ */
.catrow{display:flex;align-items:center;gap:12px;padding:11px 0}
.catrow .em{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--surface-2);flex:none}
.catrow .body{flex:1;min-width:0}
.catrow .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.catrow .top .pct{color:var(--dim);font-weight:600}
.catrow .track{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.catrow .track>i{display:block;height:100%;border-radius:99px}
.catrow .cmp{font-size:11px;font-weight:600;margin-top:5px}

/* ============ GOALS ============ */
.goal{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--surface);margin-bottom:12px;position:relative;overflow:hidden}
.goal .gh{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.goal .gem{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--aurora-soft);flex:none}
.goal .gn{flex:1}
.goal .gn b{font-size:15px;font-weight:800;display:block}
.goal .gn small{font-size:12px;color:var(--dim);font-weight:500}
.goal .gt{font-size:15px;font-weight:900;letter-spacing:-.03em}
.goal .prog{height:11px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:9px}
.goal .prog>i{display:block;height:100%;border-radius:99px;background:var(--aurora)}
.goal .meta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--dim)}
.goal .meta b{color:var(--text);font-weight:800}
.verdict{display:flex;align-items:center;gap:9px;margin-top:13px;padding:11px 13px;border-radius:14px;font-size:12.5px;font-weight:700;line-height:1.35}
.verdict.ok{background:rgba(23,230,161,.12);color:var(--pos)}
.verdict.bad{background:rgba(255,101,132,.12);color:var(--neg)}
.verdict.warn{background:rgba(255,194,75,.13);color:var(--gold)}
.gsplit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;text-align:center}
.gsplit div{background:var(--surface-2);border-radius:12px;padding:9px 4px}
.gsplit .n{font-size:13px;font-weight:800;letter-spacing:-.02em}
.gsplit .l{font-size:10px;color:var(--faint);font-weight:600;margin-top:2px}

/* ============ SCORE ============ */
.scorecard{text-align:center;padding:8px 16px 18px}
.scorecard svg{width:210px;height:150px;margin:0 auto}
.scorecard .sv{font-size:44px;font-weight:900;letter-spacing:-.04em;margin-top:-72px}
.scorecard .smax{font-size:13px;color:var(--faint);font-weight:700}
.scorecard .slabel{font-size:13px;font-weight:800;margin-top:60px;letter-spacing:.02em}
.scorebreak .sb{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.scorebreak .sb:last-child{border:none}
.scorebreak .sb .n{flex:1;font-size:13px;font-weight:600}
.scorebreak .sb .track{width:88px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.scorebreak .sb .track>i{display:block;height:100%;border-radius:99px;background:var(--aurora)}
.scorebreak .sb .pt{font-size:12px;font-weight:800;width:56px;text-align:right;color:var(--dim)}

/* ============ AI COACH ============ */
.coach{background:linear-gradient(135deg,rgba(124,108,255,.14),rgba(53,214,232,.08));
  border:1px solid var(--line-2);border-radius:20px;padding:16px}
.coach .ch{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.coach .ch .orb{width:30px;height:30px;border-radius:10px;background:var(--aurora);display:grid;place-items:center}
.coach .ch b{font-size:14px;font-weight:800}
.insight{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.insight:first-of-type{border-top:none;padding-top:2px}
.insight .ib{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:none}
.insight p{font-size:13px;font-weight:500;line-height:1.4}
.insight p b{font-weight:800}

/* ============ ALERTS ============ */
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:15px;margin-bottom:10px;border:1px solid var(--line)}
.alert .ab{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.alert b{font-size:13px;font-weight:800;display:block;margin-bottom:1px}
.alert small{font-size:12px;color:var(--dim);font-weight:500;line-height:1.35}
.alert.red{background:rgba(255,101,132,.08)} .alert.red .ab{background:rgba(255,101,132,.16);color:var(--neg)}
.alert.grn{background:rgba(23,230,161,.08)} .alert.grn .ab{background:rgba(23,230,161,.16);color:var(--pos)}
.alert.gld{background:rgba(255,194,75,.09)} .alert.gld .ab{background:rgba(255,194,75,.18);color:var(--gold)}
.alert.blu{background:rgba(77,166,255,.09)} .alert.blu .ab{background:rgba(77,166,255,.18);color:var(--blue)}

/* ============ STREAK / BADGES ============ */
.streak{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;
  background:linear-gradient(120deg,rgba(255,154,82,.14),rgba(255,194,75,.1));border:1px solid var(--line-2)}
.streak .fire{font-size:34px}
.streak .sn{font-size:30px;font-weight:900;letter-spacing:-.03em}
.streak small{font-size:12.5px;color:var(--dim);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:14px 6px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);opacity:.4;filter:grayscale(1);transition:.2s}
.badge.on{opacity:1;filter:none;background:linear-gradient(160deg,var(--surface),var(--surface-2));border-color:var(--line-2)}
.badge .be{font-size:26px}
.badge .bl{font-size:10.5px;font-weight:700;margin-top:6px;line-height:1.2;color:var(--dim)}
.badge.on .bl{color:var(--text)}

/* ============ ACCOUNTS ============ */
.acc{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border:none}
.acc .ae{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--surface-2)}
.acc .an{flex:1}
.acc .an b{font-size:14px;font-weight:700}
.acc .an small{font-size:11.5px;color:var(--faint);font-weight:600}
.acc .as{text-align:right}
.acc .as b{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.acc .as small{font-size:11px;color:var(--faint);font-weight:600}

/* ============ FLOW (sankey) ============ */
.flowwrap svg{width:100%;height:auto;display:block}
.flowleg{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
.flowleg span{font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px}

/* ============ FORECAST ============ */
.fc-tabs{display:flex;gap:8px;margin:12px 0}
.fc-tabs button{flex:1;padding:8px;border-radius:11px;font-size:12px;font-weight:700;background:var(--surface-2);
  color:var(--dim);border:1px solid transparent;transition:.15s}
.fc-tabs button.on{color:var(--text);border-color:var(--line-2);background:var(--surface)}
.fc-legend{display:flex;justify-content:space-around;margin-top:12px}
.fc-legend div{text-align:center}
.fc-legend .n{font-size:15px;font-weight:900;letter-spacing:-.03em}
.fc-legend .l{font-size:10.5px;font-weight:700;margin-top:2px;display:flex;align-items:center;gap:5px;justify-content:center}

/* ============ BOTTOM NAV ============ */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;
  padding:9px 8px calc(env(safe-area-inset-bottom) + 9px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border-top:1px solid var(--line);z-index:40}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;color:var(--faint);transition:.15s;position:relative}
.nav button svg{width:23px;height:23px}
.nav button span{font-size:10px;font-weight:700}
.nav button.on{color:var(--text)}
.nav button.on::before{content:"";position:absolute;top:-9px;width:26px;height:3px;border-radius:99px;background:var(--aurora)}

/* ============ FAB ============ */
.fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 82px);width:56px;height:56px;border-radius:19px;
  background:var(--aurora);display:grid;place-items:center;z-index:41;box-shadow:0 16px 34px -10px rgba(23,180,140,.6);transition:.16s}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px;color:#04130D}

/* ============ SHEETS / MODALS ============ */
.scrim{position:fixed;inset:0;background:rgba(3,4,8,.62);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:.22s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;width:100%;max-width:460px;z-index:91;
  background:var(--bg-soft);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:none;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:92dvh;overflow-y:auto;scrollbar-width:none;pointer-events:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:translate(-50%,0);pointer-events:auto}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:4px auto 14px}
.sheet h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
.sheet .hd-sub{font-size:12.5px;color:var(--dim);font-weight:500;margin-bottom:16px}

/* segmented */
.seg{display:flex;gap:5px;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:12px;font-weight:700;color:var(--dim);transition:.15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* amount input */
.amtin{text-align:center;margin:6px 0 20px}
.amtin .cur{font-size:26px;font-weight:700;color:var(--faint);vertical-align:top;line-height:70px}
.amtin input{font-size:52px;font-weight:900;letter-spacing:-.04em;text-align:center;background:none;border:none;
  outline:none;width:100%;max-width:300px;color:var(--text);caret-color:var(--emerald)}
.amtin input::placeholder{color:var(--surface-3)}

/* chips */
.chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;margin:0 -18px 18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:66px;padding:11px 8px;border-radius:15px;
  background:var(--surface);border:1.5px solid var(--line);transition:.15s}
.chip.on{border-color:var(--emerald);background:var(--aurora-soft)}
.chip .ce{font-size:22px}
.chip .cl{font-size:10.5px;font-weight:700;color:var(--dim)}
.chip.on .cl{color:var(--text)}

/* fields */
.field{margin-bottom:14px}
.field label{font-size:12.5px;font-weight:700;color:var(--dim);display:block;margin-bottom:7px;margin-left:2px}
.field input,.field select,.field textarea{width:100%;padding:14px 15px;border-radius:14px;background:var(--surface);

  if(!st||typeof st!=='object')return null;

function monthsBetween(a,b){a=new Date(a);b=new Date(b);return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()>=a.getDate()?0:-0);}

<script>
/* =================== MOTOR FINANCIERO =================== */
function assetsOf(s){return sum(s.accounts.filter(a=>a.type!=='credit').map(a=>a.balance));}
function liabOf(s){return sum(s.accounts.filter(a=>a.type==='credit').map(a=>Math.abs(a.balance)))+sum(s.debts.map(d=>d.balance));}
function receivablesTotal(s){return sum((s.receivables||[]).map(r=>Math.max(0,(r.amount||0)-(r.collected||0))));}
function netWorth(s){return assetsOf(s)+receivablesTotal(s)-liabOf(s);}
function availableOf(s){return sum(s.accounts.filter(a=>LIQUID.includes(a.type)).map(a=>a.balance));}
function savingsBal(s){return sum(s.accounts.filter(a=>a.type==='savings'||a.type==='investment').map(a=>a.balance));}
function totalSaved(s){return sum(s.tx.filter(t=>t.type==='saving'||t.type==='investment').map(t=>t.amount));}

function M(s){
  const now=new Date(), dim=daysInMonth(now), today=now.getDate(), daysLeft=dim-today+1;
  const tm=s.tx.filter(t=>sameMonth(t.date,now));
  const incomeM=sum(tm.filter(t=>t.type==='income').map(t=>t.amount));
  const expenseM=sum(tm.filter(t=>t.type==='expense').map(t=>t.amount));
  const savedM=sum(tm.filter(t=>t.type==='saving'||t.type==='investment').map(t=>t.amount));
  const incomeBase=s.profile.income||incomeM||0;
  const savingsRate=incomeBase>0?Math.round((savedM/incomeBase)*100):0;
  const targetSavings=s.profile.income*(s.profile.savingsRate/100);
  const fixed=sum(s.recurring.filter(r=>r.type==='expense').map(r=>r.amount));
  const debtMin=sum(s.debts.map(d=>d.minPayment||0));
  const discretionary=Math.max(0,s.profile.income-targetSavings-fixed-debtMin);
  const remaining=discretionary-expenseM;
  const canToday=Math.max(0,remaining/daysLeft);
  const spentPct=discretionary>0?clamp(expenseM/discretionary,0,1):0;
  return {dim,today,daysLeft,incomeM,expenseM,savedM,savingsRate,targetSavings,fixed,debtMin,
    discretionary,remaining,canToday,spentPct,netWorth:netWorth(s),available:availableOf(s),
    assets:assetsOf(s),liab:liabOf(s)};
}
function nwChange(s){const h=s.nwHist;if(h.length<2)return 0;return h[h.length-1].v-h[h.length-2].v;}
function avgExpense(s){
  const now=new Date(),tot=[0,0,0]; let cnt=0;
  for(let i=1;i<=3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    tot[i-1]=sum(s.tx.filter(t=>t.type==='expense'&&sameMonth(t.date,d)).map(t=>t.amount));
    if(tot[i-1]>0)cnt++;}
  return cnt?sum(tot)/cnt:0;
}
function monthCats(s,off){
  const d=new Date(); d.setMonth(d.getMonth()+off);
  const map={};
  s.tx.filter(t=>t.type==='expense'&&sameMonth(t.date,d)).forEach(t=>{map[t.category]=(map[t.category]||0)+t.amount;});
  return map;
}

/* streak: días consecutivos bajo el presupuesto diario */
function streak(s){
  const m=M(s); const allow=m.discretionary>0?m.discretionary/m.dim:Infinity;
  const byDay={}; s.tx.filter(t=>t.type==='expense').forEach(t=>{byDay[t.date]=(byDay[t.date]||0)+t.amount;});
  const start=s.profile.start?new Date(s.profile.start+'T00:00'):new Date(0);
  let cnt=0; const d=new Date();
  for(let i=0;i<180;i++){
    if(d<start)break;
    const iso=d.toISOString().slice(0,10);
    if((byDay[iso]||0)<=allow*1.0001)cnt++; else break;
    d.setDate(d.getDate()-1);
  }
  return cnt;
}

/* proyección: valor futuro con aportes mensuales compuestos */
function projFV(months,monthly,annualRate,startVal){
  const r=annualRate/100/12; let v=startVal;
  for(let i=0;i<months;i++)v=v*(1+r)+monthly;
  return v;
}
function baseMonthly(s){const m=M(s);return Math.max(m.targetSavings, m.savedM);}
function forecast(s,months,extra){
  const nw=netWorth(s), base=baseMonthly(s)+(extra||0);
  const rate=s.profile.retRate||11;
  const labels=[], cons=[], act=[], agg=[];
  for(let i=0;i<=months;i++){
    labels.push(i);
    cons.push(projFV(i,base*.9,6,nw));
    act.push(projFV(i,base,rate,nw));
    agg.push(projFV(i,base*1.12,15,nw));
  }
  return {labels,cons,act,agg,base,nw};
}

/* =========== PERÍODOS DE PAGO =========== */
function paydaysOf(s,ref){
  ref=ref||new Date(); const dim=daysInMonth(ref);
  let pds=(s.profile.paydays&&s.profile.paydays.length)?s.profile.paydays.slice():defaultPaydays(s.profile.payFreq||'monthly');
  pds=pds.map(d=>clamp(Math.round(d),1,dim));
  pds=[...new Set(pds)].sort((a,b)=>a-b);
  return pds.length?pds:[dim];
}
function dOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function daysBetweenD(a,b){return Math.round((dOnly(b)-dOnly(a))/864e5);}
function periodBounds(s,date){
  date=date||new Date(); const y=date.getFullYear(),mo=date.getMonth(),day=date.getDate();
  const pds=paydaysOf(s,date); let start,end,sd=null,ed=null;
  for(let i=pds.length-1;i>=0;i--){if(pds[i]<=day){sd=pds[i];break;}}
  if(sd!==null)start=new Date(y,mo,sd);
  else{const pm=new Date(y,mo-1,1);const p=paydaysOf(s,pm);start=new Date(pm.getFullYear(),pm.getMonth(),p[p.length-1]);}
  for(let i=0;i<pds.length;i++){if(pds[i]>day){ed=pds[i];break;}}
  if(ed!==null)end=new Date(y,mo,ed);
  else{const nm=new Date(y,mo+1,1);const n=paydaysOf(s,nm);end=new Date(nm.getFullYear(),nm.getMonth(),n[0]);}
  return {start,end,dim:daysInMonth(date)};
}
function nextPayday(s,date){return periodBounds(s,date).end;}
/* métricas del período de pago actual — base del "puedes gastar hoy".
   Parte de la PLATA REAL disponible (líquida), no de un sueldo teórico:
   disponible − ahorro reservado − fijos del período − mínimos de deuda = libre para gastar. */
function occInPeriod(day,start,end){let d=new Date(start);for(let i=0;i<40&&d<end;i++){const dim=daysInMonth(d);if(d.getDate()===Math.min(day,dim))return new Date(d);d.setDate(d.getDate()+1);}return null;}
function P(s){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),{start,end,dim}=periodBounds(s,now);
  const periodDays=Math.max(1,daysBetweenD(start,end));
  const daysLeft=Math.max(1,daysBetweenD(now,end));
  const frac=periodDays/dim;
  const inRange=iso=>{const d=new Date(iso+'T00:00');return d>=start&&d<end;};
  const avail=availableOf(s);                               // efectivo/banco/billetera reales
  const savingsTarget=(s.profile.income*(s.profile.savingsRate/100))*frac;
  const savedPeriod=sum(s.tx.filter(t=>(t.type==='saving'||t.type==='investment')&&inRange(t.date)).map(t=>t.amount));
  const reserveSavings=Math.max(0,savingsTarget-savedPeriod);
  // fijos: reserva los recurrentes de gasto que caen en este período y aún no han pasado (no doble-cuenta con lo ya posteado)
  const fixed=sum(s.recurring.filter(r=>r.type==='expense').map(r=>{const o=occInPeriod(r.day||1,start,end);return (o&&o>=today)?r.amount:0;}));
  const debtMin=sum(s.debts.map(d=>d.minPayment||0))*frac;
  const spent=sum(s.tx.filter(t=>t.type==='expense'&&inRange(t.date)).map(t=>t.amount));
  const reserve=reserveSavings+fixed+debtMin;
  const spendable=Math.max(0,avail-reserve);               // libre para gastar hasta el próximo pago
  const canToday=spendable/daysLeft;
  const leftPct=(spendable+spent)>0?clamp(spendable/(spendable+spent),0,1):1;
  const income=(s.profile.income||0)*frac;
  return {start,end,periodDays,daysLeft,frac,avail,income,savingsTarget,reserveSavings,fixed,debtMin,
    spent,reserve,spendable,canToday,leftPct,nextPay:end,freq:s.profile.payFreq||'monthly'};
}
function fmtDayShort(d){return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});}

/* WEALTH SCORE */
function score(s){
  const m=M(s);
  const c1=Math.round(clamp(m.savingsRate/40,0,1)*250);
  const burn=(m.fixed+avgExpense(s))||m.expenseM||(s.profile.income*.5)||1;
  const efMonths=(availableOf(s)+savingsBal(s))/Math.max(1,burn);
  const c2=Math.round(clamp(efMonths/6,0,1)*200);
  const dr=s.profile.income>0?liabOf(s)/(s.profile.income*6):(liabOf(s)>0?1:0);
  const c3=Math.round(clamp(1-dr,0,1)*200);
  const c4=Math.round(clamp(streak(s)/30,0,1)*150);
  const c5=nwChange(s)>0?100:(nwChange(s)===0?55:20);
  const gp=s.goals.length?sum(s.goals.map(g=>clamp(g.saved/g.target,0,1)))/s.goals.length:.4;
  const c6=Math.round(gp*100);
  return {total:c1+c2+c3+c4+c5+c6,parts:[
    {n:'Tasa de ahorro',pt:c1,max:250},{n:'Fondo de emergencia',pt:c2,max:200},
    {n:'Nivel de deuda',pt:c3,max:200},{n:'Constancia',pt:c4,max:150},
    {n:'Crecimiento patrimonial',pt:c5,max:100},{n:'Cumplimiento de metas',pt:c6,max:100},
  ],efMonths};
}
function scoreLabel(t){return t>=850?'Excelente':t>=700?'Muy bueno':t>=550?'Bueno':t>=400?'En construcción':'Empezando';}

/* INSIGHTS del coach (100% con tus datos) */
function insights(s){
  const m=M(s), out=[];
  // 1. variación categoría
  const cur=monthCats(s,0), prev=monthCats(s,-1);
  let best=null;
  Object.keys(cur).forEach(k=>{ if((prev[k]||0)>0){ const ch=(cur[k]-prev[k])/prev[k];
    if(!best||Math.abs(ch)>Math.abs(best.ch)) best={k,ch,now:cur[k]};}});
  if(best&&Math.abs(best.ch)>=.1){const c=catOf('expense',best.k);
    out.push({e:best.ch>0?'📈':'📉',t:`${best.ch>0?'Aumentaste':'Redujiste'} tus gastos de <b>${c.n.toLowerCase()}</b> un <b>${Math.round(Math.abs(best.ch)*100)}%</b> frente al mes pasado.`});}
  // 2. tasa de ahorro vs mes pasado
  const pd=new Date(); pd.setMonth(pd.getMonth()-1);
  const prevSaved=sum(s.tx.filter(t=>(t.type==='saving'||t.type==='investment')&&sameMonth(t.date,pd)).map(t=>t.amount));
  const prevRate=s.profile.income>0?Math.round(prevSaved/s.profile.income*100):0;
  if(m.savedM>0&&prevSaved>0&&prevRate!==m.savingsRate)
    out.push({e:'🎯',t:`Tu tasa de ahorro pasó de <b>${prevRate}%</b> a <b>${m.savingsRate}%</b>.`});
  // 3. proyección
  const base=baseMonthly(s);
  if(base>0){const fv=projFV(12,base,s.profile.retRate||11,netWorth(s));
    out.push({e:'🔮',t:`Si mantienes este ritmo, en <b>12 meses</b> tendrás cerca de <b>${fmtShort(fv)}</b> de patrimonio.`});}
  // 4. capacidad extra
  if(m.remaining>50000) out.push({e:'💡',t:`Puedes separar <b>${fmt(m.remaining)}</b> más este mes sin afectar tu presupuesto.`});
  // 5. mayor fuga
  const top=Object.entries(cur).sort((a,b)=>b[1]-a[1])[0];
  if(top){const c=catOf('expense',top[0]);
    out.push({e:'🔎',t:`Tu mayor gasto este mes es <b>${c.n.toLowerCase()}</b> con <b>${fmt(top[1])}</b>.`});}
  // 6. meta cercana
  const g=s.goals.filter(x=>x.saved<x.target).sort((a,b)=>(a.target-a.saved)-(b.target-b.saved))[0];
  if(g){const falta=g.target-g.saved;
    out.push({e:'🏁',t:`Estás a <b>${fmt(falta)}</b> de alcanzar tu meta <b>${g.name}</b>.`});}
  if(!out.length) out.push({e:'✨',t:'Registra tus primeros movimientos y aquí verás análisis con <b>tus datos reales</b>.'});
  return out.slice(0,4);
}

/* ALERTAS inteligentes */
function alerts(s){
  const m=M(s), out=[], ae=avgExpense(s);
  if(ae>0&&m.expenseM>ae*1.15) out.push({c:'red',e:'⚠️',t:'Gasto elevado',d:`Vas ${Math.round((m.expenseM/ae-1)*100)}% por encima de tu promedio mensual.`});
  if(m.remaining>50000) out.push({c:'grn',e:'💰',t:'Oportunidad',d:`Puedes ahorrar ${fmt(m.remaining)} adicionales este mes.`});
  const g=s.goals.filter(x=>x.saved<x.target&&(x.target-x.saved)<x.target*.15)[0];
  if(g) out.push({c:'gld',e:'🔥',t:'Meta cerca',d:`Estás a ${fmt(g.target-g.saved)} de lograr ${g.name}.`});
  const nc=nwChange(s);
  if(nc>0) out.push({c:'blu',e:'💎',t:'Progreso',d:`Tu patrimonio creció ${fmt(nc)} este mes.`});
  const bs=budgetStatus(s), over=bs.find(x=>x.spent>x.lim);
  if(over) out.unshift({c:'red',e:'🚨',t:'Presupuesto excedido',d:`Te pasaste ${fmt(over.spent-over.lim)} en ${over.cat.n.toLowerCase()} este mes.`});
  else{const near=bs.find(x=>x.pct>=.85);if(near)out.push({c:'gld',e:'📊',t:'Presupuesto al límite',d:`Vas al ${Math.round(near.pct*100)}% de tu tope de ${near.cat.n.toLowerCase()}.`});}
  const mb=s.profile.monthlyBudget;
  if(mb>0){const spentM=sum(Object.values(monthCats(s,0)));if(spentM>mb)out.unshift({c:'red',e:'🚨',t:'Tope del mes superado',d:`Llevas ${fmt(spentM)} de tu tope de ${fmt(mb)}.`});else if(spentM>=mb*.85)out.push({c:'gld',e:'⚠️',t:'Cerca del tope del mes',d:`Llevas ${Math.round(spentM/mb*100)}% de tu presupuesto mensual.`});}
  return out.slice(0,3);
}

/* meta: cálculo de proyección y veredicto */
function goalCalc(g){
  const remaining=Math.max(0,g.target-g.saved);
  const pct=g.target>0?clamp(g.saved/g.target,0,1):0;
  const contrib=g.monthly||0;
  const now=new Date();
  let monthsNeeded=contrib>0?Math.ceil(remaining/contrib):Infinity;
  const projDate=isFinite(monthsNeeded)?addMonths(now,monthsNeeded):null;
  let monthsToTarget=g.targetDate?Math.max(0,Math.round((new Date(g.targetDate)-now)/(864e5*30.44))):null;
  const requiredMonthly=(g.targetDate&&monthsToTarget>0)?remaining/monthsToTarget:remaining;
  let status='ok',msg='';
  if(remaining<=0){status='ok';msg='¡Meta cumplida! 🎉';}
  else if(g.targetDate){
    if(contrib>=requiredMonthly-1){
      const diffDays=projDate?Math.round((new Date(g.targetDate)-projDate)/864e5):0;
      status='ok'; msg=diffDays>0?`Sí. Llegarás ~${diffDays} días antes.`:'Sí, vas en camino.';
    } else {
      const extra=requiredMonthly-contrib;
      status='bad'; msg=`No con este ritmo. Necesitas ${fmt(extra)} más al mes.`;
    }
  } else {
    status=contrib>0?'ok':'warn';
    msg=contrib>0?`Llegarás en ~${monthsNeeded} ${monthsNeeded===1?'mes':'meses'}.`:'Define un aporte mensual.';
  }
  return {remaining,pct,contrib,monthsNeeded,projDate,monthsToTarget,requiredMonthly,status,msg,
    perWeek:requiredMonthly/4.345,perDay:requiredMonthly/30.44};
}

/* flujo de dinero (plan mensual) */
function flowData(s){
  const m=M(s), inc=s.profile.income||m.incomeM||0;
  const invPlan=sum(s.recurring.filter(r=>r.type==='investment').map(r=>r.amount));
  const dests=[
    {label:'Ahorro',value:Math.max(0,m.targetSavings-invPlan),color:'var(--emerald)'},
    {label:'Inversión',value:invPlan,color:'var(--violet)'},
    {label:'Gastos fijos',value:m.fixed+m.debtMin,color:'var(--orange)'},
    {label:'Disponible',value:m.discretionary,color:'var(--blue)'},
  ].filter(d=>d.value>0);
  return {inc,dests};
}

/* histórico mensual (para tendencias y resúmenes) */
function monthlyHistory(s,n){
  const out=[],now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const inc=sum(s.tx.filter(t=>t.type==='income'&&sameMonth(t.date,d)).map(t=>t.amount));
    const exp=sum(s.tx.filter(t=>t.type==='expense'&&sameMonth(t.date,d)).map(t=>t.amount));
    const sav=sum(s.tx.filter(t=>(t.type==='saving'||t.type==='investment')&&sameMonth(t.date,d)).map(t=>t.amount));
    out.push({key:mkey(d),label:d.toLocaleDateString('es-CO',{month:'short'}),income:inc,expense:exp,saved:sav,net:inc-exp});
  }
  return out;
}
/* resumen de un mes (offset 0 = actual, -1 = anterior) */
function monthSummary(s,off){
  const d=new Date(); d.setMonth(d.getMonth()+(off||0)); d.setDate(1);
  const inc=sum(s.tx.filter(t=>t.type==='income'&&sameMonth(t.date,d)).map(t=>t.amount));
  const exp=sum(s.tx.filter(t=>t.type==='expense'&&sameMonth(t.date,d)).map(t=>t.amount));
  const sav=sum(s.tx.filter(t=>(t.type==='saving'||t.type==='investment')&&sameMonth(t.date,d)).map(t=>t.amount));

/* aplica (+1) o revierte (-1) el efecto de un movimiento — usado al editar */
function applyTxEffect(t,sign){

}

let TAB='home';
const $=s=>document.querySelector(s);
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function acc(id){return S.accounts.find(a=>a.id===id);}
function accName(t){const a=acc(t.accountId);return a?a.name:'';}
function greeting(){const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';}
function todayLong(){return new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});}

function go(tab){TAB=tab;render();$('#view').scrollTo(0,0);}
function tipCard(key,text){if(S.profile.hints&&S.profile.hints[key])return '';return `<div class="tip" style="--i:0"><div class="tip-i">💡</div><div class="tip-t">${text}</div><button class="tip-x" data-act="dismisstip" data-k="${key}">${svg(IC.close,2.4)}</button></div>`;}
function dismissTip(k){if(!S.profile.hints)S.profile.hints={};S.profile.hints[k]=1;save();render();}
function render(){
  const v=$('#view');
  v.innerHTML=({home:viewHome,spend:viewSpend,goals:viewGoals,analysis:viewAnalysis,profile:viewProfile}[TAB])();
  $('#nav').innerHTML=NAV.map(([t,l,ic])=>`<button data-act="tab" data-tab="${t}" class="${t===TAB?'on':''}">${svg(ic,t===TAB?2.2:2)}<span>${l}</span></button>`).join('');
  $('#fab').style.display='grid';
  document.documentElement.setAttribute('data-theme',S.profile.theme);
  applyAccent();
  countUp();
}
function countUp(){document.querySelectorAll('[data-cnt]').forEach(el=>{
  const tg=+el.dataset.cnt,dur=680,t0=performance.now(),fmtr=el.dataset.fmt==='short'?fmtShort:fmt;
  (function tick(t){const p=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-p,3);el.textContent=fmtr(tg*e);if(p<1)requestAnimationFrame(tick);})(t0);
});}

function txRow(t){
  const cat=catOf(t.type,t.category);
  const emoji=t.type==='saving'?'🔒':t.type==='investment'?'📈':t.type==='transfer'?'🔄':t.type==='debt'?'💳':t.type==='collect'?'🤝':cat.e;
  const sign=t.type==='income'?'+':t.type==='collect'?'+':t.type==='expense'?'−':t.type==='debt'?'−':'';
  const col=(t.type==='income'||t.type==='collect')?'up':'';
  const name=t.note||(t.type==='saving'?'Ahorro':t.type==='investment'?'Inversión':t.type==='transfer'?'Transferencia':t.type==='debt'?'Pago de deuda':t.type==='collect'?'Cobro':cat.n);
  const sub=t.type==='transfer'?'Entre cuentas':t.type==='collect'?'Cobro recibido':(t.type==='income'||t.type==='expense')?cat.n:(accName(t)||cat.n);
  return `<div class="row" data-act="tx" data-id="${t.id}"><div class="em">${emoji}</div><div class="mid"><b>${esc(name)}</b><small>${esc(sub)} · ${relDate(t.date)}</small></div><div class="amt ${col} num">${sign}${fmt(t.amount)}</div></div>`;
}

/* búsqueda y filtro de movimientos */
let TXQ={q:'',type:'all'};
function txMatch(t){
  if(TXQ.type==='expense'&&t.type!=='expense')return false;
  if(TXQ.type==='income'&&t.type!=='income')return false;
  if(TXQ.type==='save'&&!(t.type==='saving'||t.type==='investment'))return false;
  if(TXQ.q){const q=TXQ.q.toLowerCase(),cat=catOf(t.type,t.category);
    if(!(((t.note||'')+' '+cat.n+' '+(accName(t)||'')).toLowerCase().includes(q)))return false;}
  return true;
}
function currentMonthTx(){return [...S.tx].filter(t=>sameMonth(t.date,new Date())).sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.id<a.id?-1:1));}
function renderTxList(){const el=document.getElementById('txlist');if(!el)return;const l=currentMonthTx().filter(txMatch);el.innerHTML=l.length?l.map(txRow).join(''):`<div class="empty" style="padding:20px"><p>Sin resultados para tu búsqueda.</p></div>`;}
function filterTx(v){TXQ.q=v;renderTxList();}

/* calendario de gastos (mapa de calor del mes) */
function calHeatmap(s){
  const now=new Date(),y=now.getFullYear(),mo=now.getMonth(),dim=daysInMonth(now),byDay={};
  s.tx.filter(t=>t.type==='expense'&&sameMonth(t.date,now)).forEach(t=>{const d=+t.date.slice(8,10);byDay[d]=(byDay[d]||0)+t.amount;});
  const vals=Object.values(byDay),maxD=Math.max(1,...vals);
  const offset=(new Date(y,mo,1).getDay()+6)%7;
  const dows=['L','M','X','J','V','S','D'].map(d=>`<div style="text-align:center;font-size:9px;color:var(--faint);font-weight:800">${d}</div>`).join('');
  let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){const sp=byDay[d]||0,inten=sp>0?(0.16+0.84*(sp/maxD)):0,isToday=d===now.getDate();
    const bg=sp>0?`rgba(255,101,132,${inten.toFixed(2)})`:'var(--surface-3)';
    cells+=`<div style="aspect-ratio:1;border-radius:7px;background:${bg};display:grid;place-items:center;font-size:10px;font-weight:700;color:${inten>0.55?'#fff':'var(--dim)'};${isToday?'outline:2px solid var(--emerald);outline-offset:-2px':''}">${d}</div>`;}
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px">${dows}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${cells}</div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px"><span class="mono-small">menos</span><div style="width:12px;height:12px;border-radius:4px;background:rgba(255,101,132,.25)"></div><div style="width:12px;height:12px;border-radius:4px;background:rgba(255,101,132,.6)"></div><div style="width:12px;height:12px;border-radius:4px;background:rgba(255,101,132,1)"></div><span class="mono-small">más</span></div>`;
}
/* =================== HOME =================== */
function viewHome(){
  const s=S,m=M(s),p=P(s),nc=nwChange(s),hist=s.nwHist.map(x=>x.v);
  const perLabel=(FREQS[p.freq]||FREQS.monthly).n.toLowerCase();
  const QA=[['expense','Gasto',IC.minus],['income','Ingreso',IC.plus],['saving','Ahorro',IC.save],['investment','Invertir',IC.invest],['debt','Deuda',IC.debt]];
  const recent=[...s.tx].sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.id<a.id?-1:1)).slice(0,4);
  const al=alerts(s), ins=insights(s).slice(0,2), upc=upcomingPayments(s,31).slice(0,4);
  return `<div class="stagger">
  <div class="hdr" style="--i:0"><div><div class="hi">${greeting()}, <b>${esc(s.profile.name||'')}</b></div><div class="date">${todayLong()}</div></div>
    <div style="display:flex;gap:9px">${(()=>{const nu=notifUnread(s);return `<button class="iconbtn" data-act="notifs" style="position:relative">${svg(IC.bell,2.1)}${nu>0?`<span class="nbadge">${nu>9?'9+':nu}</span>`:''}</button>`;})()}<button class="iconbtn" data-act="theme">${svg(s.profile.theme==='dark'?IC.sun:IC.moon,2.1)}</button>${avatarBtn('avatar','','tab','profile')}</div></div>
  ${tipCard('home','<b>Este es tu centro.</b> Ves tu patrimonio y cuánto puedes gastar hoy sin tocar tu ahorro. Usa el botón <b>+</b> (abajo) para registrar lo que sea.')}

  <div class="nw" style="--i:1"><div class="k">Patrimonio neto</div>
    <div class="v num" data-cnt="${Math.round(m.netWorth)}">${fmt(m.netWorth)}</div>
    <div class="chg ${nc>=0?'up':'down'} num">${nc>=0?'▲':'▼'} ${fmtSigned(nc)}${(()=>{const h=s.nwHist;if(h.length<2)return '';const pv=h[h.length-2].v;const gp=pv>0?Math.round(nc/pv*100):0;return gp?` (${gp>=0?'+':''}${gp}%)`:'';})()} este mes</div>
    ${chartSpark(hist)}</div>

  <div class="hero" style="--i:2" data-act="canbreak"><div class="tag">${svg(IC.info,2.4)} ver cálculo</div>
    <div class="lab">Puedes gastar hoy</div>
    <div class="big num" data-cnt="${Math.round(p.canToday)}">${fmt(p.canToday)}</div>
    <div class="sub">Con tu plata disponible, ya apartado tu ahorro y tus obligaciones, hasta tu próximo pago.</div>
    <div class="bar"><i style="width:${clamp(p.leftPct*100,3,100)}%"></i></div>
    <div class="foot"><span>Gastado: ${fmt(p.spent)}</span><span>Próximo pago: ${fmtDayShort(p.nextPay)}</span></div></div>

  <div class="qa" style="--i:3">${QA.map(([ty,l,ic])=>`<button class="${ty==='investment'?'invest':ty}" data-act="quickadd" data-type="${ty}"><div class="ic">${svg(ic,2.3)}</div><span>${l}</span></button>`).join('')}</div>

  <div class="grid3" style="--i:4;margin-top:12px">
    <div class="card stat"><div class="k">Disponible</div><div class="v num">${fmtShort(m.available)}</div></div>
    <div class="card stat"><div class="k">Ahorrado</div><div class="v num up">${fmtShort(m.savedM)}</div></div>
    <div class="card stat"><div class="k">Tasa ahorro</div><div class="v num">${m.savingsRate}%</div></div></div>

  <button class="treat" style="--i:5" data-act="treat"><div class="em">💭</div><div class="tx"><b>¿Me puedo dar este gusto?</b><small>Consulta cualquier compra antes de hacerla</small></div><div class="arw">${svg(IC.arrow,2.4)}</div></button>
  <button class="treat" style="--i:5;margin-top:10px" data-act="monthsummary" data-off="0"><div class="em">📅</div><div class="tx"><b>Resumen del mes</b><small>Mira tu cierre con calificación</small></div><div class="arw">${svg(IC.arrow,2.4)}</div></button>
  ${(()=>{const rt=receivablesTotal(s),pend=(s.receivables||[]).filter(r=>((r.amount||0)-(r.collected||0))>0);if(rt<=0)return '';const next=pend.filter(r=>r.dueDate).sort((a,b)=>a.dueDate<b.dueDate?-1:1)[0];return `<button class="card" style="--i:6;margin-top:14px;display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line-2)" data-act="receivableslist"><div class="em" style="width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:rgba(77,166,255,.14);flex:none">🤝</div><div style="flex:1"><b style="font-size:14.5px;font-weight:800;display:block">Te deben ${fmt(rt)}</b><small style="font-size:12px;color:var(--dim);font-weight:500">${pend.length} ${pend.length===1?'persona':'personas'}${next?` · próximo: ${esc(next.name)} el ${fmtDayShort(new Date(next.dueDate+'T00:00'))}`:''}</small></div><div class="arw" style="color:var(--faint)">${svg(IC.arrow,2.4)}</div></button>`;})()}

  ${al.length?`<div style="--i:6;margin-top:18px">${al.map(a=>`<div class="alert ${a.c}"><div class="ab">${a.e}</div><div><b>${a.t}</b><small>${a.d}</small></div></div>`).join('')}</div>`:''}

  ${upc.length?`<div class="sect-h" style="--i:7"><h3>Próximos pagos</h3><span class="pill">${upc.length}</span></div>
  <div class="card" style="--i:7">${upc.map(u=>`<div class="row"><div class="em">${u.emoji}</div><div class="mid"><b>${esc(u.name)}</b><small>${relDays(u.date)} · ${fmtDayShort(u.date)}</small></div><div class="amt num ${u.type==='income'?'up':''}">${u.type==='income'?'+':'−'}${fmt(u.amount)}</div></div>`).join('')}</div>`:''}

  <div class="sect-h" style="--i:8"><h3>Movimientos</h3><span class="lnk" data-act="tab" data-tab="spend">Ver todo</span></div>
  <div class="card" style="--i:7">${recent.length?recent.map(txRow).join(''):`<div class="empty" style="padding:22px"><div class="ee">🧾</div><p>Aún no hay movimientos.<br>Toca <b>+ Gasto</b> para empezar.</p></div>`}</div>

  <div class="coach" style="--i:8;margin-top:16px"><div class="ch"><div class="orb">${svg(IC.wand,2.2)}</div><b>Wealth AI</b><span class="lnk" style="margin-left:auto" data-act="tab" data-tab="analysis">Más</span></div>
    ${ins.map(i=>`<div class="insight"><div class="ib">${i.e}</div><p>${i.t}</p></div>`).join('')}</div>
  </div>`;
}

/* =================== SPEND =================== */
function viewSpend(){
  const s=S,m=M(s),cur=monthCats(s,0),prev=monthCats(s,-1);
  const entries=Object.entries(cur).sort((a,b)=>b[1]-a[1]);
  const total=sum(entries.map(e=>e[1]));
  const segs=entries.slice(0,7).map(([k,v],i)=>({label:catOf('expense',k).n,value:v,color:PALETTE[i%PALETTE.length]}));
  if(entries.length>7)segs.push({label:'Otros',value:sum(entries.slice(7).map(e=>e[1])),color:'var(--faint)'});
  const monthTx=[...s.tx].filter(t=>sameMonth(t.date,new Date())).sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.id<a.id?-1:1));
  const ae=avgExpense(s);
  const bud=budgetStatus(s);

  const legend=segs.slice(0,5).map((sg,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span class="dot" style="background:${sg.color}"></span><div style="flex:1;font-size:12.5px;font-weight:600;color:var(--dim)">${sg.label}</div><div class="num" style="font-size:12.5px;font-weight:800">${total?Math.round(sg.value/total*100):0}%</div></div>`).join('');

  const bars=entries.map(([k,v],i)=>{
    const c=catOf('expense',k),pct=total?Math.round(v/total*100):0,col=PALETTE[i%PALETTE.length];
    const pv=prev[k]||0,ch=pv>0?(v-pv)/pv:null;
    const cmp=ch===null?`<span style="color:var(--faint)">nuevo este mes</span>`:`<span style="color:${ch>0?'var(--neg)':'var(--pos)'}">${ch>0?'▲':'▼'} ${Math.abs(Math.round(ch*100))}% vs mes pasado</span>`;
    return `<div class="catrow"><div class="em">${c.e}</div><div class="body"><div class="top"><span>${c.n}</span><span class="num">${fmt(v)} <span class="pct">${pct}%</span></span></div><div class="track"><i style="width:${pct}%;background:${col}"></i></div><div class="cmp">${cmp}</div></div></div>`;
  }).join('');

  return `<div class="stagger">
  <div class="hdr" style="--i:0"><div><div class="ttl">Gastos</div><div class="subtitle">En qué se va tu plata y tus topes</div></div><button class="iconbtn" data-act="quickadd" data-type="expense">${svg(IC.plus,2.3)}</button></div>
  ${tipCard('spend','Aquí ves <b>en qué gastas</b> por categoría. Ponle un <b>tope mensual</b> en Presupuestos y te avisamos antes de pasarte.')}
  ${s.profile.monthlyBudget>0?(()=>{const mb=s.profile.monthlyBudget,pct=mb>0?total/mb:0,over=total>mb,col=over?'var(--neg)':pct>=.85?'var(--gold)':'var(--emerald)';return `<div class="card" style="--i:1;display:flex;align-items:center;gap:16px"><div style="position:relative;width:120px;height:120px;flex:none">${chartRing(pct)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="num" style="font-size:19px;font-weight:900;color:${col}">${Math.round(pct*100)}%</div><div style="font-size:9px;color:var(--faint);font-weight:700">del tope</div></div></div><div style="flex:1"><div class="eyebrow">Presupuesto del mes</div><div class="num" style="font-size:22px;font-weight:900;margin:4px 0 2px">${fmtShort(total)} <span style="font-size:13px;color:var(--faint);font-weight:700">/ ${fmtShort(mb)}</span></div><div style="font-size:12.5px;font-weight:700;color:${col}">${over?'Te pasaste '+fmt(total-mb):'Te quedan '+fmt(mb-total)}</div></div></div>`;})():''}

  ${total>0?`<div class="card" style="--i:1">
    <div class="sect-h" style="margin:0 0 6px"><h3>¿En qué se va la plata?</h3><span class="pill">${monthName(new Date())}</span></div>
    <div style="display:flex;align-items:center;gap:10px;margin:4px 0 2px">
      <div style="position:relative;width:150px;height:150px;flex:none">${chartDonut(segs,150)}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:10px;color:var(--faint);font-weight:700">Total mes</div><div class="num" style="font-size:19px;font-weight:900">${fmtShort(total)}</div></div></div>
      <div style="flex:1;min-width:0">${legend}</div></div>
    <div class="hr"></div>${bars}</div>

    <div class="grid3" style="--i:2;margin-top:12px">
      <div class="card stat"><div class="k">Este mes</div><div class="v num">${fmtShort(total)}</div></div>
      <div class="card stat"><div class="k">Mes pasado</div><div class="v num">${fmtShort(sum(Object.values(prev)))}</div></div>
      <div class="card stat"><div class="k">Prom. 3m</div><div class="v num">${fmtShort(ae)}</div></div></div>`
  :`<div class="card" style="--i:1"><div class="empty"><div class="ee">📊</div><p>Registra tus gastos y aquí verás<br>exactamente en qué se va tu plata.</p><button class="btn primary" data-act="quickadd" data-type="expense">Agregar gasto</button></div></div>`}

  <div class="sect-h" style="--i:2"><h3>Presupuestos</h3><span class="lnk" data-act="budgets">${bud.length?'Editar':'+ Crear'}</span></div>
  <div class="card" style="--i:2">${bud.length?bud.map(x=>{const over=x.spent>x.lim,near=!over&&x.pct>=.85;const col=over?'var(--neg)':near?'var(--gold)':'var(--emerald)';return `<div class="catrow"><div class="em">${x.cat.e}</div><div class="body"><div class="top"><span>${x.cat.n}</span><span class="num" style="color:${col}">${fmt(x.spent)} <span class="pct">/ ${fmtShort(x.lim)}</span></span></div><div class="track"><i style="width:${Math.min(100,x.pct*100)}%;background:${col}"></i></div><div class="cmp" style="color:${col}">${over?'⚠️ Te pasaste por '+fmt(x.spent-x.lim):near?'Vas al '+Math.round(x.pct*100)+'%, ojo':'Te quedan '+fmt(x.lim-x.spent)}</div></div></div>`;}).join(''):`<div class="empty" style="padding:18px"><p>Pon topes por categoría (comida, transporte…)<br>y te avisamos antes de pasarte.</p><button class="btn ghost" style="max-width:220px;margin:14px auto 0" data-act="budgets">Crear presupuestos</button></div>`}</div>

  ${total>0?`<div class="sect-h" style="--i:3"><h3>Calendario de gastos</h3><span class="pill">${monthName(new Date())}</span></div>
  <div class="card" style="--i:3">${calHeatmap(s)}</div>`:''}

  <div class="sect-h" style="--i:4"><h3>Movimientos del mes</h3><span class="pill">${monthTx.length}</span></div>
  <div class="card" style="--i:4">
    <div class="field" style="margin-bottom:10px"><input id="txSearch" placeholder="🔎 Buscar por nombre o categoría…" value="${esc(TXQ.q)}" oninput="filterTx(this.value)"></div>
    <div class="seg" style="margin-bottom:14px">${[['all','Todos'],['expense','Gastos'],['income','Ingresos'],['save','Ahorro']].map(([k,l])=>`<button class="${k===TXQ.type?'on':''}" data-act="txfilter" data-t="${k}">${l}</button>`).join('')}</div>
    <div id="txlist">${(()=>{const l=monthTx.filter(txMatch);return l.length?l.map(txRow).join(''):`<div class="empty" style="padding:20px"><p>${TXQ.q||TXQ.type!=='all'?'Sin resultados para tu búsqueda.':'Sin movimientos este mes.'}</p></div>`;})()}</div>
  </div>
  </div>`;
}
</script>
<script>
let FCH=12;
/* =================== GOALS =================== */
function goalCard(g){
  const c=goalCalc(g);
  const dm=g.targetDate?c.requiredMonthly:c.contrib, pw=dm/4.345, pd=dm/30.44;
  const ico=c.status==='ok'?'🟢':c.status==='bad'?'🔴':'🟡';
  return `<div class="goal"><div class="gh"><div class="gem">${g.icon||'🎯'}</div><div class="gn"><b>${esc(g.name)}</b><small>${g.targetDate?('Meta: '+fmtMY(g.targetDate)):'Sin fecha objetivo'}</small></div><div class="gt num">${fmtShort(g.target)}</div></div>
  <div class="prog"><i style="width:${Math.round(c.pct*100)}%"></i></div>
  <div class="meta"><span><b>${fmt(g.saved)}</b> · faltan ${fmt(c.remaining)}</span><span><b>${Math.round(c.pct*100)}%</b></span></div>
  <div class="gsplit"><div><div class="n num">${fmtShort(dm)}</div><div class="l">mensual</div></div><div><div class="n num">${fmtShort(pw)}</div><div class="l">semanal</div></div><div><div class="n num">${fmtShort(pd)}</div><div class="l">diario</div></div></div>
  <div class="verdict ${c.status}">${ico}<div><b style="display:block">${c.remaining<=0?'¡Meta cumplida!':'¿Vas a llegar?'}</b>${c.msg}</div></div>
  <div class="btn-row" style="margin-top:12px"><button class="btn primary" data-act="contribute" data-id="${g.id}">Abonar</button><button class="btn ghost" style="flex:0 0 auto;padding:16px 18px" data-act="editgoal" data-id="${g.id}">${svg(IC.edit,2.1)}</button></div></div>`;
}
function chainCard(c){
  const cc=chainCalc(c),col=c.color||'var(--emerald)';
  const fillW=cc.target>0?Math.round(cc.pct*100):Math.min(100,((c.count||0)%12)/12*100+8);
  const grad=`linear-gradient(90deg,${col},${col})`;
  return `<div class="goal chain-acc"><div class="gh"><div class="gem" style="background:${col};color:#04130D">🔗</div><div class="gn"><b>${esc(c.name)}</b><small>${fmtShort(c.monthly)}/mes${c.auto?' · 🔄 automático':''}</small></div>${cc.done?'<span class="pill" style="background:var(--aurora-soft);color:var(--emerald)">Completa 🎉</span>':''}</div>

  <div class="sect-h" style="--i:3"><h3>Cadenas de ahorro</h3><span class="lnk" data-act="addchain">+ Nueva</span></div>

/* =================== ANALYSIS =================== */

  <div class="card scorebreak" style="--i:2"><div class="eyebrow" style="margin-bottom:6px">Desglose del score</div>${sc.parts.map(p=>`<div class="sb"><div class="n">${p.n}</div><div class="track"><i style="width:${Math.round(p.pt/p.max*100)}%"></i></div><div class="pt">${p.pt}/${p.max}</div></div>`).join('')}</div>

  <div class="sect-h" style="--i:3"><h3>Tendencias</h3><span class="pill">6 meses</span></div>

  <div class="sect-h" style="--i:6"><h3>Logros</h3></div>

    return `<div class="card" style="--i:7">
    ${(perm==='default'||(perm==='granted'&&!P.on))?`<button class="btn primary" style="margin-bottom:10px" data-act="enablenotifs">🔔 Activar avisos en el celular</button>`:''}
    ${perm==='denied'?`<div class="mono-small" style="margin-bottom:10px">🔕 Bloqueadas en el navegador. Actívalas en los ajustes del sitio.</div>`:''}

    ${tgl('pagos','📅','Pagos y cobros','Lo que se viene esta semana')}${tgl('topes','📊','Topes de gasto','Cuando te acercas o te pasas')}${tgl('deudas','💳','Deudas','Recordatorio de abonar')}${tgl('cobros','🤝','Me deben','Cuando se acerca una fecha de cobro')}${tgl('flujos','🔄','Actividad y resumen','Movimientos automáticos y cierre de mes')}
    </div>`;})()}

  <div class="sect-h" style="--i:7"><h3>Apariencia</h3></div>

  <div class="sect-h" style="--i:8"><h3>Ajustes</h3></div>

<script>
/* =================== HOJAS / MODALES =================== */
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('show');$('#scrim').classList.add('show');}
function closeSheet(){$('#sheet').classList.remove('show');$('#scrim').classList.remove('show');}
function moneyInput(el){const c=el.value.replace(/[^\d]/g,'');el.value=c?Number(c).toLocaleString('es-CO'):'';}
const GEMOJI=['🎯','🏠','🚗','✈️','🎓','💍','🏖️','📱','💻','🚀','👶','🐶','💰','🛡️'];
function accOpts(pool,sel){return pool.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} · ${fmtShort(a.balance)}</option>`).join('');}

/* ---- REGISTRO RÁPIDO ---- */
let DR={amt:'',note:'',date:'',src:'',dest:''}, QA_TYPE='expense', QA_CAT=null;
function captureQA(){const g=id=>{const e=$('#'+id);return e?e.value:undefined;};
  let v;
  if((v=g('qaAmt'))!==undefined)DR.amt=v; if((v=g('qaNote'))!==undefined)DR.note=v;
  if((v=g('qaDate'))!==undefined)DR.date=v; if((v=g('qaSrc'))!==undefined)DR.src=v;
  if((v=g('qaDest'))!==undefined)DR.dest=v;}
function openQuickAdd(type){QA_TYPE=type||'expense';QA_CAT=null;DR={amt:'',note:'',date:todayISO(),src:'',dest:''};renderQuickAdd(true);$('#sheet').classList.add('show');$('#scrim').classList.add('show');}
function renderQuickAdd(focus){
  const type=QA_TYPE;
  const T={expense:['Registrar gasto','¿En qué se te fue?'],income:['Registrar ingreso','¿De dónde viene?'],saving:['Ahorrar','Sepáralo para tu futuro'],investment:['Invertir','Haz crecer tu dinero']};
  const cats=type==='income'?INC_CATS:EXP_CATS;
  if(QA_CAT===null&&(type==='expense'||type==='income'))QA_CAT=cats[0].id;
  const liquid=S.accounts.filter(a=>LIQUID.includes(a.type));
  const destPool=S.accounts.filter(a=>a.type===(type==='investment'?'investment':'savings'));
  let b=`<div class="seg">${[['expense','Gasto'],['income','Ingreso'],['saving','Ahorro'],['investment','Invertir']].map(([t,l])=>`<button class="${t===type?'on':''}" data-act="qatype" data-type="${t}">${l}</button>`).join('')}</div>`;
  b+=`<div class="amtin"><span class="cur">$</span><input id="qaAmt" inputmode="numeric" placeholder="0" value="${DR.amt||''}" oninput="moneyInput(this)"></div>`;
  if(type==='expense'||type==='income')
    b+=`<div class="chips">${cats.map(c=>`<button class="chip ${c.id===QA_CAT?'on':''}" data-act="qacat" data-id="${c.id}"><div class="ce">${c.e}</div><div class="cl">${c.n}</div></button>`).join('')}</div>`;
  const sel=(id,lab,pool)=>`<div class="field"><label>${lab}</label><select id="${id}" class="field-sel" style="width:100%;padding:14px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600">${pool.length?accOpts(pool,id==='qaDest'?DR.dest:DR.src):'<option value="__auto">Se creará automáticamente</option>'}</select></div>`;
  if(type==='expense')b+=sel('qaSrc','Pagar desde',liquid);
  if(type==='income')b+=sel('qaSrc','Recibir en',liquid);
  if(type==='saving'||type==='investment'){b+=sel('qaSrc','Desde',liquid);b+=sel('qaDest',type==='investment'?'Hacia inversión':'Hacia ahorro',destPool);}
  b+=`<div class="frow"><div class="field"><label>Nota</label><input id="qaNote" placeholder="Opcional" value="${esc(DR.note||'')}"></div><div class="field"><label>Fecha</label><input id="qaDate" type="date" value="${DR.date||todayISO()}"></div></div>`;
  b+=`<button class="btn primary" data-act="savetx">Guardar movimiento</button>`;
  $('#sheet').innerHTML=`<div class="grab"></div><h2>${T[type][0]}</h2><div class="hd-sub">${T[type][1]}</div>`+b;
  if(focus)setTimeout(()=>{const a=$('#qaAmt');if(a){a.focus();}},260);
}

/* ---- META (crear/editar) ---- */
function sheetGoal(g){
  const e=g||{}; const ic=e.icon||'🎯';
  openSheet(`<h2>${g?'Editar meta':'Nueva meta'}</h2><div class="hd-sub">¿Para qué estás ahorrando?</div>
  <div class="chips" id="gemo">${GEMOJI.map(x=>`<button class="chip ${x===ic?'on':''}" data-act="gemoji" data-e="${x}" style="min-width:52px"><div class="ce">${x}</div></button>`).join('')}</div>
  <input type="hidden" id="gIcon" value="${ic}">
  <div class="field"><label>Nombre</label><input id="gName" placeholder="Ej: Viaje a Europa" value="${esc(e.name||'')}"></div>
  <div class="frow"><div class="field"><label>Objetivo</label><input id="gTarget" inputmode="numeric" placeholder="0" value="${e.target?e.target.toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div>
    <div class="field"><label>Ya tengo</label><input id="gSaved" inputmode="numeric" placeholder="0" value="${e.saved?e.saved.toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div></div>
  <div class="frow"><div class="field"><label>Aporte mensual</label><input id="gMonthly" inputmode="numeric" placeholder="0" value="${e.monthly?e.monthly.toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div>
    <div class="field"><label>Fecha objetivo</label><input id="gDate" type="date" value="${e.targetDate||''}"></div></div>
  <div class="field"><span class="hint">Si pones fecha, calculamos cuánto necesitas ahorrar. Si pones aporte, calculamos cuándo llegas.</span></div>
  <button class="btn primary" data-act="savegoal" data-id="${e.id||''}">${g?'Guardar cambios':'Crear meta'}</button>
  ${g?`<button class="btn danger" style="margin-top:10px" data-act="delgoal" data-id="${e.id}">Eliminar meta</button>`:''}`);
}

/* ---- ABONAR A META ---- */
function sheetContribute(g){
  const liquid=S.accounts.filter(a=>LIQUID.includes(a.type));
  openSheet(`<h2>Abonar a ${esc(g.name)}</h2><div class="hd-sub">Faltan ${fmt(Math.max(0,g.target-g.saved))} para tu meta</div>
  <div class="amtin"><span class="cur">$</span><input id="cAmt" inputmode="numeric" placeholder="0" oninput="moneyInput(this)"></div>
  <div class="field"><label>Desde</label><select id="cSrc" class="field-sel" style="width:100%;padding:14px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600">${liquid.length?accOpts(liquid,''):'<option value="__auto">Cuenta principal</option>'}</select></div>
  <button class="btn primary" data-act="savecontrib" data-id="${g.id}">Abonar</button>`);

/* ---- CUENTA (crear/editar) ---- */
function sheetAccount(a){
  const e=a||{}; const ty=e.type||'bank';
  openSheet(`<h2>${a?'Editar cuenta':'Nueva cuenta'}</h2><div class="hd-sub">¿Dónde tienes tu dinero?</div>
  <div class="chips" id="atype">${Object.entries(ACC_TYPES).map(([k,v])=>`<button class="chip ${k===ty?'on':''}" data-act="atype" data-t="${k}"><div class="ce">${v.e}</div><div class="cl">${v.n}</div></button>`).join('')}</div>

  ${a?`<button class="btn danger" style="margin-top:10px" data-act="delacc" data-id="${e.id}">Eliminar</button>`:''}`);
}

/* ---- DEUDA (crear/editar) ---- */
function sheetDebt(d){
  const e=d||{};
  openSheet(`<h2>${d?'Editar deuda':'Nueva deuda'}</h2><div class="hd-sub">Vamos a darle salida a esa deuda</div>
  <div class="field"><label>Nombre</label><input id="dName" placeholder="Ej: Tarjeta de crédito" value="${esc(e.name||'')}"></div>

  <div class="frow"><div class="field"><label>Tasa % E.A.</label><input id="dRate" inputmode="decimal" placeholder="0" value="${e.rate||''}"></div>
    <div class="field"><label>Cuota mensual</label><input id="dMin" inputmode="numeric" placeholder="0" value="${e.minPayment?e.minPayment.toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div></div>
  <button class="btn primary" data-act="savedebt" data-id="${e.id||''}">${d?'Guardar':'Agregar deuda'}</button>
  ${d?`<button class="btn danger" style="margin-top:10px" data-act="deldebt" data-id="${e.id}">Eliminar</button>`:''}`);

/* ---- PAGAR DEUDA ---- */
function sheetPayDebt(){
  if(!S.debts.length)return sheetDebt();
  const liquid=S.accounts.filter(a=>LIQUID.includes(a.type));
  openSheet(`<h2>Pagar deuda</h2><div class="hd-sub">Cada abono te acerca a la libertad 🔥</div>
  <div class="field"><label>¿Cuál deuda?</label><select id="pDebt" class="field-sel" style="width:100%;padding:14px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600">${S.debts.map(d=>`<option value="${d.id}">${esc(d.name)} · debes ${fmtShort(d.balance)}</option>`).join('')}</select></div>
  <div class="amtin"><span class="cur">$</span><input id="pAmt" inputmode="numeric" placeholder="0" oninput="moneyInput(this)"></div>
  <div class="field"><label>Pagar desde</label><select id="pSrc" class="field-sel" style="width:100%;padding:14px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600">${liquid.length?accOpts(liquid,''):'<option value="__auto">Cuenta principal</option>'}</select></div>
  <button class="btn primary" data-act="savepay">Registrar pago</button>`);
}
/* ---- TRANSFERENCIA ENTRE CUENTAS ---- */
function sheetTransfer(){
  if(S.accounts.length<2){openSheet(`<h2>Transferencia</h2><div class="hd-sub">Necesitas al menos 2 cuentas para transferir</div><button class="btn primary" data-act="addaccount">Agregar cuenta</button><button class="btn ghost" style="margin-top:10px" data-act="closesheet">Cerrar</button>`);return;}
  const opts=sel=>S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${ACC_TYPES[a.type].e} ${esc(a.name)} · ${fmtShort(a.balance)}</option>`).join('');
  const ss='width:100%;padding:14px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600';
  openSheet(`<h2>Transferencia</h2><div class="hd-sub">Mueve plata entre tus cuentas (no afecta tu patrimonio)</div>
  <div class="amtin"><span class="cur">$</span><input id="trAmt" inputmode="numeric" placeholder="0" oninput="moneyInput(this)"></div>
  <div class="field"><label>Desde</label><select id="trFrom" style="${ss}">${opts(S.accounts[0].id)}</select></div>
  <div class="field"><label>Hacia</label><select id="trTo" style="${ss}">${opts(S.accounts[1].id)}</select></div>
  <div class="field"><label>Nota</label><input id="trNote" placeholder="Opcional"></div>
  <button class="btn primary" data-act="savetransfer">Transferir</button>`);
}
/* ---- CUENTAS POR COBRAR (me deben) ---- */
function sheetReceivable(item){
  const e=item||{},rem=Math.max(0,(e.amount||0)-(e.collected||0));
  openSheet(`<h2>${item?'Editar deuda a favor':'Alguien me debe'}</h2><div class="hd-sub">Controla lo que te deben y cuándo lo cobras</div>
  <div class="field"><label>¿Quién te debe?</label><input id="rvName" placeholder="Ej: Camilo" value="${esc(e.name||'')}"></div>
  <div class="field"><label>Monto que te debe</label><input id="rvAmount" inputmode="numeric" placeholder="0" value="${e.amount?e.amount.toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div>
  <div class="field"><label>Fecha de cobro</label><input id="rvDate" type="date" value="${e.dueDate||''}"><span class="hint">Te avisaremos cuando se acerque.</span></div>
  <div class="field"><label>Nota</label><input id="rvNote" placeholder="Opcional (ej: préstamo)" value="${esc(e.note||'')}"></div>
  ${item&&rem>0?`<div class="mono-small" style="margin-bottom:10px">Ya cobrado: ${fmt(e.collected||0)} · Falta: ${fmt(rem)}</div>`:''}
  <button class="btn primary" data-act="savereceivable" data-id="${e.id||''}">${item?'Guardar':'Agregar'}</button>
  ${item?`<button class="btn ghost" style="margin-top:10px" data-act="collect" data-id="${e.id}">Registrar cobro</button><button class="btn danger" style="margin-top:10px" data-act="delreceivable" data-id="${e.id}">Eliminar</button>`:''}`);
}
function sheetCollect(rc){
  const liquid=S.accounts.filter(a=>LIQUID.includes(a.type)),rem=Math.max(0,(rc.amount||0)-(rc.collected||0));
  openSheet(`<h2>Cobrar a ${esc(rc.name)}</h2><div class="hd-sub">Te debe ${fmt(rem)}</div>
  <div class="amtin"><span class="cur">$</span><input id="rcAmt" inputmode="numeric" placeholder="${rem.toLocaleString('es-CO')}" value="${rem.toLocaleString('es-CO')}" oninput="moneyInput(this)"></div>
  <div class="field"><label>Entra a</label><select id="rcTo" style="width:100%;padding:14px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600">${liquid.length?accOpts(liquid,''):'<option value="__auto">Cuenta principal</option>'}</select></div>
  <button class="btn primary" data-act="savecollect" data-id="${rc.id}">Registrar cobro</button>`);
}
/* ---- DETALLE: TODOS LOS QUE TE DEBEN ---- */
function sheetReceivablesList(){
  const rs=S.receivables||[];
  const totalRem=receivablesTotal(S),collected=sum(rs.map(r=>r.collected||0)),pend=rs.filter(r=>((r.amount||0)-(r.collected||0))>0);
  openSheet(`<h2>Te deben</h2><div class="hd-sub">Quién te debe, cuánto y cuándo cobrar</div>
  <div class="bigverdict g" style="padding:16px"><div style="font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.65">TOTAL POR COBRAR</div><div class="num" style="font-size:34px;font-weight:900;line-height:1;margin:5px 0">${fmt(totalRem)}</div></div>
  <div class="vstats"><div><div class="n num">${pend.length}</div><div class="l">pendientes</div></div><div><div class="n num up">${fmtShort(collected)}</div><div class="l">ya cobrado</div></div><div><div class="n num">${rs.length}</div><div class="l">registros</div></div></div>
  <div class="divlab">Detalle</div>
  ${rs.length?rs.slice().sort((a,b)=>{const ra=(a.amount-(a.collected||0))<=0,rb=(b.amount-(b.collected||0))<=0;if(ra!==rb)return ra?1:-1;const da=a.dueDate||'9999',db=b.dueDate||'9999';return da<db?-1:1;}).map(r=>{const rem=Math.max(0,(r.amount||0)-(r.collected||0)),done=rem<=0;const due=r.dueDate?new Date(r.dueDate+'T00:00'):null,dn=due?relDaysNum(due):null,late=dn!==null&&dn<0&&!done;
    return `<div class="goal" style="padding:14px"><div class="gh" style="margin-bottom:10px"><div class="gem" style="background:${done?'var(--surface-3)':'rgba(77,166,255,.15)'}">${done?'✅':'🤝'}</div><div class="gn"><b>${esc(r.name)}</b><small>${done?'Cobrado completo':(due?(late?'⚠️ venció '+relDays(due).replace('en ','hace ').replace('hace -','hace ')+' ('+fmtDayShort(due)+')':'cobrar '+relDays(due)+' · '+fmtDayShort(due)):'sin fecha de cobro')}</small></div><div class="gt num" style="color:${done?'var(--faint)':'var(--blue)'}">${fmtShort(rem)}</div></div>
    ${r.collected>0?`<div class="prog" style="height:8px"><i style="width:${Math.round((r.collected/r.amount)*100)}%;background:var(--blue)"></i></div><div class="meta" style="margin-top:6px"><span>Cobrado <b>${fmt(r.collected)}</b> de ${fmt(r.amount)}</span><span>${Math.round(r.collected/r.amount*100)}%</span></div>`:''}
    ${r.note?`<div class="mono-small" style="margin-top:8px">📝 ${esc(r.note)}</div>`:''}
    ${!done?`<div class="btn-row" style="margin-top:12px"><button class="btn primary" data-act="collect" data-id="${r.id}">Registrar cobro</button><button class="btn ghost" style="flex:0 0 auto;padding:16px 18px" data-act="editreceivable" data-id="${r.id}">${svg(IC.edit,2.1)}</button></div>`:`<button class="btn ghost" style="margin-top:10px" data-act="editreceivable" data-id="${r.id}">Ver / editar</button>`}</div>`;}).join('')
  :`<div class="empty" style="padding:24px"><div class="ee">🤝</div><p>Nadie te debe registrado aún.</p></div>`}
  <button class="btn ghost" data-act="addreceivable">+ Agregar quién te debe</button>`);
}
</script>
<script>
/* =================== HOJAS DE DECISIÓN =================== */
function kv(label,val,cls,sign){return `<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)"><span style="font-size:13.5px;font-weight:600;color:var(--dim)">${label}</span><span class="num ${cls||''}" style="font-size:14.5px;font-weight:800">${sign||''}${fmt(val)}</span></div>`;}

/* ---- DESGLOSE "PUEDES GASTAR" ---- */
function sheetBreakdown(){
  const p=P(S),freq=(FREQS[p.freq]||FREQS.monthly).n;
  const periodTxt=fmtDayShort(p.start)+' → '+fmtDayShort(p.end);
  openSheet(`<h2>Cómo calculamos esto</h2><div class="hd-sub">Partimos de la plata que ya tienes y cuidamos tu ahorro y obligaciones</div>
  <div class="pill" style="margin-bottom:12px">📅 Período de pago (${freq.toLowerCase()}): ${periodTxt}</div>
  <div class="card flat" style="padding:2px 15px;margin-bottom:14px">
    ${kv('Disponible ahora (efectivo/banco)',p.avail,'up','+')}
    ${kv('Reservado para tu ahorro',p.reserveSavings,'','−')}
    ${kv('Gastos fijos (de este período)',p.fixed,'','−')}
    ${kv('Mínimos de deuda (de este período)',p.debtMin,'','−')}
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0"><b style="font-size:14px">Libre para gastar</b><b class="num ${p.spendable>=0?'up':'down'}" style="font-size:16px">${fmt(p.spendable)}</b></div>
  </div>
  <div class="hero" style="margin-bottom:4px"><div class="lab">Puedes gastar hoy</div><div class="big num" style="font-size:44px">${fmt(p.canToday)}</div><div class="sub">${fmt(p.spendable)} ÷ ${p.daysLeft} días hasta tu próximo pago (${fmtDayShort(p.nextPay)}).</div></div>
  <p class="mono-small" style="margin:12px 2px 0">Se actualiza solo: cada gasto baja tu disponible, cada ahorro protege tu meta, y al llegar tu próximo pago el presupuesto se reinicia. Tus ahorros e inversiones no se tocan aquí.</p>
  <button class="btn ghost" style="margin-top:14px" data-act="closesheet">Entendido</button>`);
}

/* ---- ¿ME PUEDO DAR ESTE GUSTO? ---- */
let TR={name:'',price:0};
function sheetTreat(){
  openSheet(`<h2>¿Me puedo dar este gusto?</h2><div class="hd-sub">Consúltalo antes de comprar y decide con datos</div>
  <div class="field"><label>¿Qué quieres comprar?</label><input id="tName" placeholder="Ej: Audífonos nuevos" value="${esc(TR.name||'')}"></div>
  <div class="amtin"><span class="cur">$</span><input id="tPrice" inputmode="numeric" placeholder="0" value="${TR.price?TR.price.toLocaleString('es-CO'):''}" oninput="moneyInput(this)"></div>
  <button class="btn primary" data-act="evaltreat">Evaluar compra</button>`);
  setTimeout(()=>{const a=$('#tName');if(a)a.focus();},260);
}
function sheetTreatResult(){
  const p=P(S),nw=netWorth(S),price=TR.price,free=p.spendable;
  const pctBudget=free>0?Math.round(price/free*100):100;
  const pctNW=nw>0?(price/nw*100):100;
  const after=free-price;
  const dailySave=baseMonthly(S)/30.44;
  const delay=dailySave>0?Math.round(price/dailySave):null;
  let lv,em,ti,de;
  if(price<=free*0.5&&pctNW<3){lv='g';em='🟢';ti='¡Dale, puedes!';de=`Te quedarían ${fmt(after)} libres hasta tu próximo pago. Es solo el ${pctNW.toFixed(1)}% de tu patrimonio.`;}
  else if(price<=free||pctNW<6){lv='y';em='🟡';ti='Puedes, con cuidado';de=`Te dejaría ${fmt(Math.max(0,after))} libres hasta tu próximo pago${delay?` y retrasaría tus metas ~${delay} días`:''}.`;}
  else{lv='r';em='🔴';ti='Mejor espera';de=`Supera lo que tienes libre por ${fmt(price-free)}${delay?` y atrasa tus metas ~${delay} días`:''}. ¿Puede esperar?`;}
  openSheet(`<h2>${esc(TR.name||'Esa compra')}</h2><div class="hd-sub">${fmt(price)}</div>
  <div class="bigverdict ${lv}"><div class="ve">${em}</div><div class="vt">${ti}</div><div class="vd">${de}</div></div>
  <div class="vstats"><div><div class="n num">${pctBudget}%</div><div class="l">de lo que tienes libre</div></div><div><div class="n num">${pctNW<10?pctNW.toFixed(1):Math.round(pctNW)}%</div><div class="l">de tu patrimonio</div></div><div><div class="n num">${delay!=null?delay:'—'}</div><div class="l">días de meta</div></div></div>
  <div class="btn-row" style="margin-top:14px"><button class="btn ghost" data-act="treat">Otra compra</button><button class="btn primary" data-act="treatlog">Registrar gasto</button></div>`);
}

/* ---- ¿QUÉ PASA SI...? ---- */
let WI_EXTRA=0, WI_H=12;
function sheetWhatIf(){
  WI_EXTRA=0; WI_H=12;
  const maxExtra=Math.max(500000,Math.round((S.profile.income||2000000)*0.6/50000)*50000);
  openSheet(`<h2>¿Qué pasa si...?</h2><div class="hd-sub">Mueve la palanca y mira tu futuro cambiar</div>
  <div class="field"><label>Ahorrar cada mes <b id="wiLab" class="num" style="color:var(--emerald)">+$0</b> adicionales</label>
    <input class="slider" id="wiSlider" type="range" min="0" max="${maxExtra}" step="50000" value="0" oninput="onWiSlider(this.value)"></div>
  <div class="fc-tabs" id="wiTabs">${[[3,'3m'],[6,'6m'],[9,'9m'],[12,'1a'],[24,'2a']].map(([mo,l])=>`<button class="${mo===WI_H?'on':''}" data-act="wih" data-m="${mo}">${l}</button>`).join('')}</div>
  <div id="wiRes"></div>`);
  updateWhatIf();
}
function onWiSlider(v){WI_EXTRA=+v;const l=$('#wiLab');if(l)l.textContent='+'+fmtShort(WI_EXTRA);updateWhatIf();}
function updateWhatIf(){
  const base=forecast(S,WI_H,0),ext=forecast(S,WI_H,WI_EXTRA);
  const bV=base.act[WI_H],eV=ext.act[WI_H],diff=eV-bV,hz=WI_H<12?WI_H+' meses':(WI_H===12?'1 año':(WI_H/12)+' años');
  const r=$('#wiRes');if(!r)return;
  r.innerHTML=`<div class="scen"><div class="box"><div class="l">Ritmo actual</div><div class="n num">${fmtShort(bV)}</div></div><div class="arw">→</div><div class="box new"><div class="l">Con el cambio</div><div class="n num up">${fmtShort(eV)}</div></div></div>
  <div class="verdict ${diff>0?'ok':'warn'}">${diff>0?'🚀':'👆'}<div><b style="display:block">${diff>0?'+'+fmt(diff)+' en '+hz:'Sube el ahorro mensual'}</b>${WI_EXTRA>0?'Son '+fmtShort(WI_EXTRA/30.44)+' al día que se convierten en patrimonio.':'Arrastra la palanca para ver el impacto real.'}</div></div>
